<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- keep "default": "black-translucent" makes iOS 26 blur the top of the home-screen app -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="theme-color" content="#e4e5e8">
<script>
  // Set light/dark before anything draws, and tell iOS the exact top colour.
  // A mismatch here is what makes iOS 26 blur the top of a home-screen web app.
  (function () {
    var t = null;
    try { t = localStorage.getItem("homeboard-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    try { var k = localStorage.getItem("homeboard-skin"); if (k) document.documentElement.setAttribute("data-skin", k); } catch (e) {}
    setTimeout(function () { document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()); }, 0);
  })();
</script>
<title>Weekly Plan</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e4e5e8;
  --ink: #2b2e33;
  --muted: #7a7f88;
  --hair: #d0d2d6;
  --ash: #d45b6c;
  --ben: #4f7bd4;
  --both: #6f8a5c;
  --chip: #d5d7db;
  --today: #2b2e33;
  --field: #d9dbdf;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
    --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
    --chip: #2a2b30; --today: #e4e4e2; --field: #26272c;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
  --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
  --chip: #2a2b30; --today: #e4e4e2; --field: #26272c;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
html { height: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 500px; margin: 0 auto; display: flex; flex-direction: column;   /* no forced full height: short lists don't scroll */
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 0; }
.title h1 { margin: 0; font-size: 24px; white-space: nowrap; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
.title p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.title .range { color: var(--muted); font-size: 14px; font-weight: 600; margin-left: 8px; letter-spacing: 0; }
.nav { display: flex; gap: 8px; }
.nav button {
  width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: var(--chip); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.nav .theme svg { width: 18px; height: 18px; }
#skin svg { stroke-width: 2; } #skin circle { fill: currentColor; stroke: none; }
.nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.top {
  position: sticky; top: 0; z-index: 4;
  margin: 0 -16px; padding: calc(4px + env(safe-area-inset-top, 0px)) 16px 0;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  background: var(--bg);
}
.cols {
  display: grid; grid-template-columns: 56px repeat(3, 1fr);
  padding: 8px 0 6px; border-bottom: 0.5px solid var(--hair);
  font-size: 13px; font-weight: 700; color: var(--muted); text-align: center;
}

#days { flex: 1; display: flex; flex-direction: column; }
.day {
  flex: 0 0 auto; min-height: 64px; padding: 8px 0; border-bottom: 0.5px solid var(--hair);
  display: flex; flex-direction: column; justify-content: center;
}
.row { display: grid; grid-template-columns: 56px repeat(3, 1fr); align-items: center; }
.dname {
  display: flex; flex-direction: column; align-items: flex-start; position: relative;
  appearance: none; border: 0; background: none; color: inherit; font: inherit; cursor: pointer;
  padding: 4px 0; text-align: left;
}
.dname .dow { font-size: 13px; font-weight: 700; color: var(--muted); }
.dname:focus-visible { outline: 2px solid var(--ben); outline-offset: 2px; border-radius: 8px; }
.dname .num {
  font-size: 19px; font-weight: 800; line-height: 1; margin-top: 2px;
  min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 15px; margin-left: -5px; padding: 0 4px;
}
.day.today .dname .dow { color: var(--ink); }
.day.today .dname .num { background: var(--today); color: var(--bg); }

.cell {
  justify-self: center; appearance: none; border: 0; cursor: pointer;
  width: 46px; height: 46px; border-radius: 23px;
  font-family: inherit; font-size: 19px; font-weight: 800; line-height: 1;
  color: var(--muted); background: var(--chip);
  transition: transform .12s ease, background-color .15s ease;
}
.cell:active { transform: scale(.92); }
.cell[data-v="A"] { background: var(--ash); color: #fff; }
.cell[data-v="B"] { background: var(--ben); color: #fff; }
.cell[data-v="Both"] { background: var(--both); color: #fff; font-size: 12px; letter-spacing: -0.2px; }
.cell:focus-visible, textarea:focus-visible, .nav button:focus-visible { outline: 2px solid var(--ben); outline-offset: 2px; }

.notes-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease; }
.notes-panel > div { overflow: hidden; }
.day.open .notes-panel, .day.has-note .notes-panel { grid-template-rows: 1fr; }
.day.has-note { flex: 0 0 auto; }
textarea {
  display: block; width: 100%; margin: 4px 0 2px; resize: none; overflow: hidden;
  border: 0; border-radius: 10px; background: var(--field); color: var(--ink);
  font-size: 16px; line-height: 1.4; font-weight: 500; font-family: inherit; /* 16px stops iOS zoom on focus */
  padding: 7px 12px; min-height: 36px;
}
textarea:focus { outline: none; }
textarea::placeholder { color: var(--muted); opacity: .7; }

/* bottom bar: small Edit pill above the page tabs (same as Groceries) */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 0.5px solid var(--hair);
  padding: 8px 0 calc(4px + env(safe-area-inset-bottom, 0px));
}
.tabs { display: flex; justify-content: center; padding-top: 4px; }
.tabs a {
  flex: 0 1 120px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; padding: 4px 0;
}
.tabs a.on { color: var(--ink); }
.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

@media (prefers-reduced-motion: reduce) { .notes-panel { transition: none; } .cell { transition: none; } .cell:active { transform: none; } }

body.checking .wrap, body.checking .bottom, body.checking .gate { visibility: hidden; }
body.locked .wrap, body.locked .bottom { display: none; }
.gate {
  display: none; position: fixed; inset: 0; z-index: 20; overflow: hidden;
  align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg);
}

.gate form {
  position: relative; z-index: 1;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border-radius: 24px; padding: 30px 22px 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,.10);
}
body.locked .gate { display: flex; }
.gate form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.gate img { width: 76px; height: 76px; border-radius: 18px; margin: 0 auto 4px; }
.gate h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
.gate .hello { margin: 0 0 6px; color: var(--ink); font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.gate input {
  width: 100%; border: 0; border-radius: 12px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 17px; padding: 14px; text-align: left;
}
.gate input:focus { outline: 2px solid var(--ben); outline-offset: 0; }
.gate button {
  border: 0; border-radius: 12px; background: var(--ink); color: var(--bg);
  font: inherit; font-size: 17px; font-weight: 700; padding: 14px; cursor: pointer;
}
.gate button:disabled { opacity: .5; }
.gate .err { color: var(--ash); font-size: 15px; min-height: 1.4em; margin: 0; }
.hidden { display: none !important; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600;
  padding: 10px 16px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }


/* solid strip behind the status bar / Dynamic Island so nothing scrolls under it (any iPhone) */
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: env(safe-area-inset-top, 0px); background: var(--bg); pointer-events: none;
}

/* home-screen app only: nudge content down, clear of the iOS status-bar blur */
@media (display-mode: standalone) {
  .top { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
}

/* icon-only tab bar (5 pages) */
.tabs { padding-top: 2px; }
.tabs a { flex: 0 1 76px !important; padding: 8px 0 6px !important; }
.tabs svg { width: 29px !important; height: 29px !important; stroke-width: 1.8 !important; }
.tabs a.on svg { stroke-width: 2.2 !important; }
.tabs a.on::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 3px; background: var(--ink); margin: 4px auto 0; }
.tabs a:not(.on)::after { content: ""; display: block; height: 5px; margin-top: 4px; }

/* view-only accounts: no editing controls, nothing tappable in the lists */
.vo { display: none; align-items: center; height: 36px; padding: 0 12px; border-radius: 18px; background: var(--chip); color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
body.viewonly .vo { display: inline-flex; }
body.viewonly #addBtn, body.viewonly #gear, body.viewonly #clearBtn { display: none !important; }
body.viewonly #list, body.viewonly #gotList, body.viewonly #days { pointer-events: none; }
body.viewonly .who, body.viewonly .kind, body.viewonly .dpill, body.viewonly .store, body.viewonly .check,
body.viewonly .when, body.viewonly .tile, body.viewonly .cell { cursor: default; }
/* week arrows sit right beside the dates */
.wk-nav { display: inline-flex; align-items: center; margin-left: 2px; vertical-align: middle; position: relative; top: -1px; white-space: nowrap; }
.title h1 { white-space: normal !important; }
header { align-items: flex-start !important; gap: 8px; }
.title { min-width: 0; }
.title .range { font-size: 13px !important; }
body.viewonly .vo { font-size: 12px; padding: 0 9px; }
.wk-nav button {
  appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer;
  width: 22px; height: 30px; padding: 0; display: grid; place-items: center; border-radius: 8px;
}
.wk-nav button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.wk-nav button:active { background: var(--chip); }
.wk-nav button:disabled { opacity: .25; cursor: default; background: none; pointer-events: none; }
.title .range { margin-left: 0 !important; position: relative; }
.title .range.other { color: var(--ben); }
.title .range.other::after {
  content: attr(aria-label); position: absolute; left: 0; right: 0; top: 100%; text-align: center;
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; white-space: nowrap;
}
body.viewonly .wk-nav { pointer-events: auto; }
/* empty bubble shows a small person, same as TODOS */
.cell svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; margin: auto; }
/* Sat & Sun: same rows as the weekdays, just a note instead of bubbles */
.day.weekend .row { cursor: pointer; }
.day.weekend .wk-hint { grid-column: 2 / -1; color: var(--muted); opacity: .55; font-size: 14px; font-weight: 600; padding-left: 6px; }
.day.weekend.has-note .wk-hint, .day.weekend.open .wk-hint { visibility: hidden; }
body.viewonly .day.weekend .wk-hint { display: none; }
/* slightly smaller rows so all seven days fit */
.day { min-height: 56px !important; padding: 5px 0 !important; }
.cell { width: 42px !important; height: 42px !important; border-radius: 21px !important; font-size: 18px !important; }
.cell[data-v="Both"] { font-size: 11px !important; }
.dname .dow { font-size: 12px !important; }
.dname .num { font-size: 18px !important; min-width: 28px !important; height: 28px !important; }
/* ---- colour themes (palette button on Weekly Plan; applies on every page) ---- */
:root[data-skin="barbie"][data-theme="light"] { --bg: #f8e7ef; --ink: #3b1f33; --muted: #9b7489; --hair: #ecd0dd; --ash: #d9467f; --ben: #5b7fd6; --both: #6f9a73; --chip: #f0d5e1; --today: #e0218a; --field: #f2dbe6; }
:root[data-skin="barbie"][data-theme="dark"] { --bg: #2a1624; --ink: #f7dde9; --muted: #b98ba4; --hair: #3e2437; --ash: #ee5b98; --ben: #7394e0; --both: #80ae83; --chip: #3a2134; --today: #ff4fa3; --field: #331c2d; }
:root[data-skin="espresso"][data-theme="light"] { --bg: #efe5d8; --ink: #3a2a20; --muted: #8d7866; --hair: #ddcebc; --ash: #c55f5b; --ben: #5a739c; --both: #7b8a58; --chip: #e3d5c3; --today: #6f4a2f; --field: #e8dccc; }
:root[data-skin="espresso"][data-theme="dark"] { --bg: #211813; --ink: #efe2d2; --muted: #a38d79; --hair: #34271f; --ash: #cf7068; --ben: #7390c2; --both: #8f9c69; --chip: #30241c; --today: #d4a373; --field: #2a1f19; }
:root[data-skin="halloween"][data-theme="light"] { --bg: #f3e9dc; --ink: #2b2230; --muted: #8b7e86; --hair: #e2d4c3; --ash: #d2574d; --ben: #6b64c9; --both: #6b9a44; --chip: #e9dac8; --today: #e8772e; --field: #eee0cf; }
:root[data-skin="halloween"][data-theme="dark"] { --bg: #17151b; --ink: #f1e8dd; --muted: #8f8797; --hair: #2b2731; --ash: #e0645a; --ben: #8a78e6; --both: #80b34c; --chip: #26222c; --today: #ff7a1a; --field: #211e26; }
body, .top, .bottom, .day, .cell, .dname .num { transition: background-color .35s ease, color .35s ease; }
.tabs a.on { color: var(--today) !important; }
.tabs a.on::after { background: var(--today) !important; }
#skin.spin { animation: moonspin .6s cubic-bezier(.3,1.4,.5,1); }
@keyframes moonspin { 0% { transform: rotate(0) scale(1); } 60% { transform: rotate(300deg) scale(1.2); } 100% { transform: rotate(360deg) scale(1); } }
#skin, #theme { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.skin-toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 41;
  transform: translate(-50%, 10px) scale(.96); opacity: 0; pointer-events: none;
  background: var(--today); color: var(--bg); font-size: 15px; font-weight: 800; letter-spacing: .2px;
  padding: 9px 18px; border-radius: 20px; box-shadow: 0 6px 22px rgba(0,0,0,.18);
  transition: opacity .2s, transform .25s cubic-bezier(.3,1.4,.5,1);
}
.skin-toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body class="checking">

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="on">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <p class="err" id="loginErr"></p>
    <button type="submit" id="loginBtn">Sign in</button>
  </form>
</div>



<div class="wrap" id="boardView">
  <div class="top">
  <header>
    <div class="title"><h1>Weekly Plan<span class="wk-nav"><!-- last week / this week / next week only --><button id="prev" aria-label="Last week"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="range" id="title"></span><button id="next" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></span></h1></div>
    <div class="nav">
      <span class="vo">View only</span>
      <button id="skin" class="theme" aria-label="Change colour theme"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.8-1.7H16a5 5 0 0 0 5-5C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="15" cy="7.8" r="1.2"/></svg></button>
      <button id="theme" class="theme" aria-label="Switch theme"></button>
    </div>
  </header>
  <div class="cols"><span></span><span>Drop off</span><span>Pick up</span><span>Dinner</span></div>
  </div>
  <div id="days"></div>
</div>

<div class="bottom">
  <nav class="tabs">
    <a href="./" class="on" aria-label="Week" title="Week"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></a>
    <a href="groceries.html" aria-label="Groceries" title="Groceries"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6l2-8H6.6"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg></a>
    <a href="meals.html" aria-label="Meals" title="Meals"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 21V3c-2 1.5-3 4-3 7v3h3"/></svg></a>
    <a href="todos.html" aria-label="TODOS" title="TODOS"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M8.5 12.3l2.4 2.4 4.6-5"/></svg></a>
    <a href="plans.html" aria-label="Plans" title="Plans"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.4l-5.1 2.7 1-5.6-4.1-4 5.7-.8z"/></svg></a>
  </nav>
</div>


<div class="skin-toast" id="skinToast" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  // ---- Supabase connection (the anon key is meant to be public; the table is protected by login) ----
  var SUPABASE_URL = "https://rkvfdveuqueavjsredtm.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdmZkdmV1cXVlYXZqc3JlZHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTY2OTcsImV4cCI6MjEwNTc3MjY5N30.yDt5ivDzLFoBRvrzzuSmT4EEMnIcsjx3XWkvQ6iTfeU";
  var PERSON_ICON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>';   // empty bubble: tap to assign
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Short lists shouldn't scroll: when the keyboard closes, iOS can leave the page nudged
  // upward. If everything fits on screen, put it back at the top.
  function snapBack() {
    setTimeout(function () {
      if (document.documentElement.scrollHeight <= window.innerHeight + 2 && window.scrollY !== 0) window.scrollTo(0, 0);
    }, 150);
  }
  document.addEventListener("focusout", snapBack);
  window.addEventListener("resize", snapBack);
  if (window.visualViewport) visualViewport.addEventListener("resize", snapBack);

  // View-only accounts: the database already refuses their changes; this just hides the
  // editing controls so nothing looks tappable. Household logins are "editors".
  function checkRole() {
    db.rpc("is_editor").then(function (r) {
      var viewer = !r.error && r.data === false;
      document.body.classList.toggle("viewonly", viewer);
      if (viewer) document.querySelectorAll("textarea").forEach(function (t) { t.readOnly = true; });
    }, function () {});
  }

  var CYCLE = ["", "A", "B", "Both"];
  var NAMES = { "": "nobody yet", A: "Ash", B: "Ben", Both: "both of us" };
  var SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FIELDS = [["drop_off","Drop off"],["pick_up","Pick up"],["dinner","Dinner"]];

  var data = {};     // date -> row
  var refs = {};     // date -> { paint: {field: fn}, t: textarea, day: el }
  var today = new Date();
  var thisWeek, weekStart, channel = null;

  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
  function autosize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  function blank() { return { drop_off: "", pick_up: "", dinner: "", notes: "" }; }
  thisWeek = weekStart = mondayOf(today);

  var toastEl = document.getElementById("toast"), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  // ---- theme ----
  var MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var themeBtn = document.getElementById("theme");
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || (t === "dark" ? "#1d1e22" : "#e4e5e8"));
    themeBtn.innerHTML = t === "dark" ? SUN : MOON;
    themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("homeboard-theme"); } catch (e) {}
  applyTheme(savedTheme || currentTheme());
  // ---- colour themes: palette button cycles Classic / Barbie / Espresso / Halloween ----
  function applySkin(k) {
    if (k) document.documentElement.setAttribute("data-skin", k); else document.documentElement.removeAttribute("data-skin");
    applyTheme(currentTheme());
    try { localStorage.setItem("homeboard-skin", k || ""); } catch (e) {}
  }
  var savedSkin = ""; try { savedSkin = localStorage.getItem("homeboard-skin") || ""; } catch (e) {}
  applySkin(savedSkin);
  var SKIN_ORDER = ["", "barbie", "espresso", "halloween"];
  var SKIN_NAME = { "": "Classic", barbie: "Barbie", espresso: "Espresso", halloween: "Halloween" };
  function nextSkin() {
    var cur = document.documentElement.getAttribute("data-skin") || "";
    var k = SKIN_ORDER[(SKIN_ORDER.indexOf(cur) + 1) % SKIN_ORDER.length];
    var sb = document.getElementById("skin"); sb.classList.remove("spin"); void sb.offsetWidth; sb.classList.add("spin");
    if (navigator.vibrate) navigator.vibrate(12);
    applySkin(k);
    var t = document.getElementById("skinToast"); t.textContent = SKIN_NAME[k];
    t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
    clearTimeout(nextSkin.t); nextSkin.t = setTimeout(function () { t.classList.remove("show"); }, 1400);
  }
  document.getElementById("skin").addEventListener("click", nextSkin);
  themeBtn.addEventListener("click", function () {
    var t = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(t);
    try { localStorage.setItem("homeboard-theme", t); } catch (e) {}
  });

  // ---- saving ----
  function saveField(key, field, value) {
    data[key] = data[key] || blank();
    data[key][field] = value;
    var row = { date: key, updated_at: new Date().toISOString() };
    row[field] = value;
    return db.from("days").upsert(row, { onConflict: "date" }).then(function (res) {
      if (res.error) toast("Couldn't save. Check your connection.");
    });
  }
  var noteTimers = {};
  function saveNoteSoon(key, value) {
    data[key] = data[key] || blank();
    data[key].notes = value;
    clearTimeout(noteTimers[key]);
    noteTimers[key] = setTimeout(function () { saveField(key, "notes", value); }, 600);
  }

  // ---- drawing ----
  function applyRow(key) {
    var r = refs[key]; if (!r) return;
    var row = data[key] || blank();
    FIELDS.forEach(function (f) { if (r.paint[f[0]]) r.paint[f[0]](CYCLE.indexOf(row[f[0]] || "") > 0 ? row[f[0]] : ""); });
    if (document.activeElement !== r.t) { r.t.value = row.notes || ""; autosize(r.t); }
    r.day.classList.toggle("has-note", !!(row.notes || "").trim());
    if ((row.notes || "").trim()) autosize(r.t);
  }

  function render() {
    var wrap = document.getElementById("days");
    wrap.innerHTML = ""; refs = {};
    var sun = addDays(weekStart, 6);
    document.getElementById("title").textContent = SHORT[weekStart.getMonth()] + " " + weekStart.getDate() + " – " +
      (sun.getMonth() !== weekStart.getMonth() ? SHORT[sun.getMonth()] + " " : "") + sun.getDate();

    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function (label, i) {
      var weekend = i >= 5;   // Sat & Sun: just a note, no drop off / pick up / dinner
      var date = addDays(weekStart, i);
      var key = iso(date);
      var day = document.createElement("section");
      day.className = "day" + (weekend ? " weekend" : "") + (key === iso(today) ? " today" : "");
      var r = document.createElement("div");
      r.className = "row";

      var dn = document.createElement("button");
      dn.className = "dname";
      dn.setAttribute("aria-expanded", "false");
      dn.setAttribute("aria-label", label + " " + date.getDate() + ", show notes");
      dn.innerHTML = '<span class="dow">' + label + '</span><span class="num">' + date.getDate() + '</span><span class="dot"></span>';
      r.appendChild(dn);

      var paint = {};
      if (weekend) {
        var hint = document.createElement("span"); hint.className = "wk-hint"; hint.textContent = "Add a note";
        r.appendChild(hint);
      }
      if (!weekend) FIELDS.forEach(function (f) {
        var b = document.createElement("button");
        b.className = "cell";
        paint[f[0]] = function (v) {
          b.dataset.v = v; if (v) b.textContent = v; else b.innerHTML = PERSON_ICON;
          b.setAttribute("aria-label", label + " " + f[1] + ": " + NAMES[v]);
        };
        paint[f[0]]("");
        b.addEventListener("click", function () {
          if (!editing) return;
          var v = CYCLE[(CYCLE.indexOf(b.dataset.v) + 1) % CYCLE.length];
          paint[f[0]](v);
          saveField(key, f[0], v);
        });
        r.appendChild(b);
      });
      day.appendChild(r);

      var t = document.createElement("textarea");
      t.rows = 1; t.placeholder = "Notes";
      t.setAttribute("aria-label", label + " notes");
      t.addEventListener("input", function () {
        autosize(t);
        day.classList.toggle("has-note", !!t.value.trim());
        saveNoteSoon(key, t.value);
      });
      var panel = document.createElement("div"); panel.className = "notes-panel";
      var inner = document.createElement("div"); inner.appendChild(t); panel.appendChild(inner);
      day.appendChild(panel);
      function toggleNote() {
        if (!editing) return;
        var open = day.classList.toggle("open");
        dn.setAttribute("aria-expanded", String(open));
        if (open) { autosize(t); if (!t.value) t.focus({ preventScroll: true }); } else t.blur();
      }
      // weekdays: tap the day name; weekend: tap anywhere on the row
      if (weekend) r.addEventListener("click", toggleNote); else dn.addEventListener("click", toggleNote);

      wrap.appendChild(day);
      refs[key] = { paint: paint, t: t, day: day };
      applyRow(key);
    });
  }

  function loadWeek() {
    var from = iso(weekStart), to = iso(addDays(weekStart, 6));
    return db.from("days").select("*").gte("date", from).lte("date", to).then(function (res) {
      if (res.error) { toast("Couldn't load the week."); return; }
      res.data.forEach(function (row) { data[row.date] = row; applyRow(row.date); });
    });
  }

  function listen() {
    if (channel) return;
    channel = db.channel("days-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "days" }, function (payload) {
        var row = payload.new;
        if (!row || !row.date) return;
        data[row.date] = row;
        applyRow(row.date);
      })
      .subscribe();
  }

  // Arrows move one week back or forward from this week, and no further
  function weekOffset() { return Math.round((weekStart - thisWeek) / (7 * 86400000)); }
  function paintArrows() {
    var o = weekOffset();
    document.getElementById("prev").disabled = o <= -1;
    document.getElementById("next").disabled = o >= 1;
    var t = document.getElementById("title");
    t.classList.toggle("other", o !== 0);
    t.setAttribute("aria-label", o === 0 ? "This week" : o < 0 ? "Last week" : "Next week");
  }
  function go(n) {
    var o = Math.max(-1, Math.min(1, weekOffset() + n));
    weekStart = addDays(thisWeek, 7 * o); render(); loadWeek(); paintArrows();
  }
  document.getElementById("prev").addEventListener("click", function () { go(-1); });
  document.getElementById("next").addEventListener("click", function () { go(1); });

  window.addEventListener("resize", function () { Object.keys(refs).forEach(function (k) { autosize(refs[k].t); }); });
  // phone waking up or reopening the app: catch up on anything missed
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && refs && Object.keys(refs).length) {
      var now = new Date();
      if (iso(now) !== iso(today)) { today = now; thisWeek = weekStart = mondayOf(today); render(); paintArrows(); }
      loadWeek();
    }
  });

  // always editable once signed in
  var editing = true;
  document.body.classList.add("editing");
  var started = false;
  function START() { paintArrows();
    if (started) { loadWeek(); return; }
    started = true;
    render(); loadWeek(); listen();
  }

  // ---- sign-in gate: the whole app needs the household login; each phone stays signed in ----
  function lock() { document.body.classList.remove("checking"); document.body.classList.add("locked"); }
  function unlock() { document.body.classList.remove("checking", "locked"); }
  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
    btn.disabled = true; err.textContent = "";
    db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    }).then(function (res) {
      btn.disabled = false;
      if (res.error) { err.textContent = "That email or password didn't match."; return; }
      document.getElementById("password").value = "";
      unlock(); START(); checkRole();
    });
  });
  db.auth.onAuthStateChange(function (event) { if (event === "SIGNED_OUT") lock(); });
  db.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { unlock(); START(); checkRole(); } else lock();
  });
})();
</script>
<script>
// stop pinch-zoom and double-tap-zoom in iOS Safari
document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
</script>
