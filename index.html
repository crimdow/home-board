<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- keep "default": "black-translucent" makes iOS 26 blur the top of the home-screen app -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="theme-color" content="#e4e5e8">
<script>
  // Set light/dark and the colour theme before anything draws.
  // "homeboard-theme" = light | dark (missing = follow the phone). "homeboard-skin" = colour theme.
  (function () {
    var t = null, k = "";
    try { t = localStorage.getItem("homeboard-theme"); k = localStorage.getItem("homeboard-skin") || ""; } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    if (k) document.documentElement.setAttribute("data-skin", k);
  })();
</script>
<title>Home Board</title>
<style>
/* ================= shared look for every page ================= */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e4e5e8; --ink: #2b2e33; --muted: #7a7f88; --hair: #d0d2d6;
  --ash: #d45b6c; --ben: #4f7bd4; --both: #6f8a5c;
  --chip: #d5d7db; --today: #2b2e33; --field: #d9dbdf; --sheet: #eeeff1;
  /* colours for stores, weekdays and TODO types */
  --s0: #d45b6c; --s1: #4f7bd4; --s2: #6f8a5c; --s3: #c98a3e; --s4: #8a6bb8; --s5: #3f9a93; --s6: #b8735a;
}
:root[data-theme="dark"] {
  --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
  --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
  --chip: #2a2b30; --today: #e4e4e2; --field: #26272c; --sheet: #25262b;
  --s0: #cf6475; --s1: #5f86d6; --s2: #7d9a68; --s3: #cf9550; --s4: #9679c2; --s5: #4fa69f; --s6: #c4826a;
}
/* colour themes (picked in the More menu) */
:root[data-skin="barbie"][data-theme="light"] { --bg: #f8e7ef; --ink: #3b1f33; --muted: #9b7489; --hair: #ecd0dd; --ash: #d9467f; --ben: #5b7fd6; --both: #6f9a73; --chip: #f0d5e1; --today: #e0218a; --field: #f2dbe6; --sheet: #fdf1f6; }
:root[data-skin="barbie"][data-theme="dark"] { --bg: #2a1624; --ink: #f7dde9; --muted: #b98ba4; --hair: #3e2437; --ash: #ee5b98; --ben: #7394e0; --both: #80ae83; --chip: #3a2134; --today: #ff4fa3; --field: #331c2d; --sheet: #331c2d; }
:root[data-skin="espresso"][data-theme="light"] { --bg: #efe5d8; --ink: #3a2a20; --muted: #8d7866; --hair: #ddcebc; --ash: #c55f5b; --ben: #5a739c; --both: #7b8a58; --chip: #e3d5c3; --today: #6f4a2f; --field: #e8dccc; --sheet: #f6eee4; }
:root[data-skin="espresso"][data-theme="dark"] { --bg: #211813; --ink: #efe2d2; --muted: #a38d79; --hair: #34271f; --ash: #cf7068; --ben: #7390c2; --both: #8f9c69; --chip: #30241c; --today: #d4a373; --field: #2a1f19; --sheet: #2a1f19; }
:root[data-skin="halloween"][data-theme="light"] { --bg: #f3e9dc; --ink: #2b2230; --muted: #8b7e86; --hair: #e2d4c3; --ash: #d2574d; --ben: #6b64c9; --both: #6b9a44; --chip: #e9dac8; --today: #e8772e; --field: #eee0cf; --sheet: #f9f2e9; }
:root[data-skin="halloween"][data-theme="dark"] { --bg: #17151b; --ink: #f1e8dd; --muted: #8f8797; --hair: #2b2731; --ash: #e0645a; --ben: #8a78e6; --both: #80b34c; --chip: #26222c; --today: #ff7a1a; --field: #211e26; --sheet: #211e26; }

*, *::before, *::after { box-sizing: inherit; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
html { height: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  transition: background-color .35s ease, color .35s ease;
}
.hidden { display: none !important; }
.wrap {
  max-width: 500px; margin: 0 auto;   /* no forced full height: short pages don't scroll */
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.page { display: flex; flex-direction: column; }
.page[hidden] { display: none; }
.page-msg { padding: 60px 0; text-align: center; color: var(--muted); font-weight: 600; }
.page-msg button { margin-top: 10px; border: 0; border-radius: 10px; background: var(--chip); color: var(--ink); font: inherit; font-weight: 700; padding: 10px 16px; }

/* page header: sticky title row */
.top {
  position: sticky; top: 0; z-index: 4;
  margin: 0 -16px; padding: calc(4px + env(safe-area-inset-top, 0px)) 16px 0;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  background: var(--bg); transition: background-color .35s ease;
}
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 4px 0 0; }
.title { min-width: 0; }
.title h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
.nav { display: flex; gap: 8px; }
.nav button {
  width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: var(--chip); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.nav button:focus-visible { outline: 2px solid var(--ben); outline-offset: 2px; }
/* view-only accounts see a small chip instead of editing controls */
.vo { display: none; align-items: center; height: 36px; padding: 0 9px; border-radius: 18px; background: var(--chip); color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
body.viewonly .vo { display: inline-flex; }

/* solid strip behind the status bar / Dynamic Island so nothing scrolls under it */
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: env(safe-area-inset-top, 0px); background: var(--bg); pointer-events: none;
}
/* home-screen app only: nudge content down, clear of the iOS status-bar blur */
@media (display-mode: standalone) {
  .top { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
}

/* ---- bottom tab bar: this phone's pinned pages + More ---- */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 0.5px solid var(--hair);
  padding: 8px 0 calc(4px + env(safe-area-inset-bottom, 0px));
}
.tabs { display: flex; justify-content: center; padding-top: 2px; max-width: 500px; margin: 0 auto; }
.tabs a {
  flex: 0 1 76px; display: flex; flex-direction: column; align-items: center;
  color: var(--muted); text-decoration: none; padding: 8px 0 6px; cursor: pointer;
}
.tabs svg { width: 29px; height: 29px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs a.on { color: var(--today); }
.tabs a.on svg { stroke-width: 2.2; }
.tabs a::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 3px; margin: 4px auto 0; }
.tabs a.on::after { background: var(--today); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600;
  padding: 10px 16px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ---- More menu (bottom sheet) ---- */
#moreBg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .22s; }
#moreBg.show { opacity: 1; pointer-events: auto; }
#more {
  position: fixed; left: 50%; bottom: 0; z-index: 31; width: 100%; max-width: 500px;
  max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  transform: translate(-50%, 105%); visibility: hidden;
  background: var(--sheet); color: var(--ink); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.18);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  transition: transform .3s cubic-bezier(.32,.72,0,1), visibility 0s linear .3s, background-color .35s;
}
#more.show { transform: translate(-50%, 0); visibility: visible; transition: transform .3s cubic-bezier(.32,.72,0,1), visibility 0s, background-color .35s; }
#more .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--hair); margin: 0 auto 10px; }
#more .sh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
#more .sh-head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
#more .linkbtn { appearance: none; border: 0; background: none; color: var(--ben); font: inherit; font-size: 16px; font-weight: 700; padding: 6px 2px; cursor: pointer; }
#more h3 { margin: 18px 4px 6px; font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
#more h3 small { text-transform: none; letter-spacing: 0; font-weight: 600; margin-left: 4px; }
#more .group { background: var(--bg); border-radius: 14px; overflow: hidden; transition: background-color .35s; }
#more .pg-row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 6px 12px;
  appearance: none; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer;
}
#more .pg-row + .pg-row { border-top: 0.5px solid var(--hair); }
#more .pg-row .ico { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); flex: none; }
#more .pg-row .ico svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#more .pg-row .nm { flex: 1; font-size: 17px; font-weight: 600; }
#more .pg-row.here .ico, #more .pg-row.here .nm { color: var(--today); }
#more .pg-row .tag { font-size: 12px; font-weight: 700; color: var(--muted); }
#more .pg-row .ctl { display: flex; gap: 4px; }
#more .pg-row .ctl button {
  width: 34px; height: 34px; border-radius: 17px; border: 0; background: var(--chip); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
#more .pg-row .ctl button:disabled { opacity: .3; cursor: default; }
#more .pg-row .ctl button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
#more .pg-row .ctl .rm { color: var(--ash); }
#more .pg-row .ctl .add { color: var(--both); }
#more .pg-empty { padding: 14px 12px; color: var(--muted); font-size: 14px; font-weight: 600; }

#more .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--chip); border-radius: 12px; }
#more .seg button { border: 0; border-radius: 9px; background: none; color: var(--muted); font: inherit; font-size: 15px; font-weight: 700; padding: 9px 0; cursor: pointer; }
#more .seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

#more .skins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
#more .skin {
  appearance: none; border: 2px solid transparent; border-radius: 14px; padding: 10px 4px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 7px; font: inherit;
}
#more .skin.on { border-color: var(--ink); }
#more .skin .dots { display: flex; gap: 3px; }
#more .skin .dots i { width: 13px; height: 13px; border-radius: 7px; display: block; }
#more .skin b { font-size: 12px; font-weight: 800; }

#more .acct { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; }
#more .acct span { color: var(--muted); font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#more .acct button { flex: none; border: 0; border-radius: 10px; background: var(--chip); color: var(--ash); font: inherit; font-size: 15px; font-weight: 700; padding: 8px 14px; cursor: pointer; }

/* undo bar */
.undo {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 25;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); border-radius: 22px; padding: 10px 10px 10px 16px;
  font-size: 14px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.2);
}
.undo.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.undo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.undo button { border: 0; border-radius: 14px; background: var(--ben); color: #fff; font: inherit; font-size: 14px; font-weight: 800; padding: 6px 14px; cursor: pointer; flex: none; }

/* full-page sign-in gate */
body.checking .wrap, body.checking .bottom, body.checking .gate { visibility: hidden; }
body.locked .wrap, body.locked .bottom { display: none; }
.gate {
  display: none; position: fixed; inset: 0; z-index: 20; overflow: hidden;
  align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg);
}

  var started = false;
  function start(session) {
    document.body.classList.remove("checking", "locked");
    var who = session && session.user && session.user.email;
    document.getElementById("whoami").textContent = who ? "Signed in as " + who : "Signed in";
    checkRole();
    if (!started) { started = true; paintTabs(); show(location.hash.slice(1)); }
  }
  function lock() { document.body.classList.remove("checking"); document.body.classList.add("locked"); }
  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
    btn.disabled = true; err.textContent = "";
    db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    }).then(function (res) {
      btn.disabled = false;
      if (res.error) { err.textContent = "That email or password didn't match."; return; }
      document.getElementById("password").value = "";
      start(res.data && res.data.session);
    });
  });
  db.auth.onAuthStateChange(function (event) { if (event === "SIGNED_OUT") lock(); });
  db.auth.getSession().then(function (res) {
    if (res.data && res.data.session) start(res.data.session); else lock();
  });
})();
</script>
<script>
// stop pinch-zoom and double-tap-zoom in iOS Safari
document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
</script>
