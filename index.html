<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- keep "default": "black-translucent" makes iOS 26 blur the top of the home-screen app -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="theme-color" content="#e4e5e8">
<script>
  // Set light/dark and the colour theme before anything draws.
  // "homeboard-theme" = light | dark (missing = follow the phone). "homeboard-skin" = colour theme.
  (function () {
    var t = null, k = "";
    try { t = localStorage.getItem("homeboard-theme"); k = localStorage.getItem("homeboard-skin") || ""; } catch (e) {}
    if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    if (k) document.documentElement.setAttribute("data-skin", k);
  })();
</script>
<title>Home Board</title>
<style>
/* ================= shared look for every page ================= */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e4e5e8; --ink: #2b2e33; --muted: #7a7f88; --hair: #d0d2d6;
  --ash: #d45b6c; --ben: #4f7bd4; --both: #6f8a5c;
  --chip: #d5d7db; --today: #2b2e33; --field: #d9dbdf; --sheet: #eeeff1;
  /* colours for stores, weekdays and TODO types */
  --s0: #d45b6c; --s1: #4f7bd4; --s2: #6f8a5c; --s3: #c98a3e; --s4: #8a6bb8; --s5: #3f9a93; --s6: #b8735a;
}
:root[data-theme="dark"] {
  --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
  --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
  --chip: #2a2b30; --today: #e4e4e2; --field: #26272c; --sheet: #25262b;
  --s0: #cf6475; --s1: #5f86d6; --s2: #7d9a68; --s3: #cf9550; --s4: #9679c2; --s5: #4fa69f; --s6: #c4826a;
}
/* colour themes (picked in the More menu) */
:root[data-skin="barbie"][data-theme="light"] { --bg: #f8e7ef; --ink: #3b1f33; --muted: #9b7489; --hair: #ecd0dd; --ash: #d9467f; --ben: #5b7fd6; --both: #6f9a73; --chip: #f0d5e1; --today: #e0218a; --field: #f2dbe6; --sheet: #fdf1f6; }
:root[data-skin="barbie"][data-theme="dark"] { --bg: #2a1624; --ink: #f7dde9; --muted: #b98ba4; --hair: #3e2437; --ash: #ee5b98; --ben: #7394e0; --both: #80ae83; --chip: #3a2134; --today: #ff4fa3; --field: #331c2d; --sheet: #331c2d; }
:root[data-skin="espresso"][data-theme="light"] { --bg: #efe5d8; --ink: #3a2a20; --muted: #8d7866; --hair: #ddcebc; --ash: #c55f5b; --ben: #5a739c; --both: #7b8a58; --chip: #e3d5c3; --today: #6f4a2f; --field: #e8dccc; --sheet: #f6eee4; }
:root[data-skin="espresso"][data-theme="dark"] { --bg: #211813; --ink: #efe2d2; --muted: #a38d79; --hair: #34271f; --ash: #cf7068; --ben: #7390c2; --both: #8f9c69; --chip: #30241c; --today: #d4a373; --field: #2a1f19; --sheet: #2a1f19; }
:root[data-skin="halloween"][data-theme="light"] { --bg: #f3e9dc; --ink: #2b2230; --muted: #8b7e86; --hair: #e2d4c3; --ash: #d2574d; --ben: #6b64c9; --both: #6b9a44; --chip: #e9dac8; --today: #e8772e; --field: #eee0cf; --sheet: #f9f2e9; }
:root[data-skin="halloween"][data-theme="dark"] { --bg: #17151b; --ink: #f1e8dd; --muted: #8f8797; --hair: #2b2731; --ash: #e0645a; --ben: #8a78e6; --both: #80b34c; --chip: #26222c; --today: #ff7a1a; --field: #211e26; --sheet: #211e26; }

*, *::before, *::after { box-sizing: inherit; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
html { height: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  transition: background-color .35s ease, color .35s ease;
}
.hidden { display: none !important; }
.wrap {
  max-width: 500px; margin: 0 auto;   /* no forced full height: short pages don't scroll */
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.page { display: flex; flex-direction: column; }
.page[hidden] { display: none; }
.page-msg { padding: 60px 0; text-align: center; color: var(--muted); font-weight: 600; }
.page-msg button { margin-top: 10px; border: 0; border-radius: 10px; background: var(--chip); color: var(--ink); font: inherit; font-weight: 700; padding: 10px 16px; }

/* page header: sticky title row */
.top {
  position: sticky; top: 0; z-index: 4;
  margin: 0 -16px; padding: calc(4px + env(safe-area-inset-top, 0px)) 16px 0;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  background: var(--bg); transition: background-color .35s ease;
}
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 4px 0 0; }
.title { min-width: 0; }
.title h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
.nav { display: flex; gap: 8px; }
.nav button {
  width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: var(--chip); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.nav button:focus-visible { outline: 2px solid var(--ben); outline-offset: 2px; }
/* view-only accounts see a small chip instead of editing controls */
.vo { display: none; align-items: center; height: 36px; padding: 0 9px; border-radius: 18px; background: var(--chip); color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
body.viewonly .vo { display: inline-flex; }

/* solid strip behind the status bar / Dynamic Island so nothing scrolls under it */
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: env(safe-area-inset-top, 0px); background: var(--bg); pointer-events: none;
}
/* home-screen app only: nudge content down, clear of the iOS status-bar blur */
@media (display-mode: standalone) {
  .top { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
}

/* ---- bottom tab bar: this phone's pinned pages + More ---- */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 0.5px solid var(--hair);
  padding: 8px 0 calc(4px + env(safe-area-inset-bottom, 0px));
}
.tabs { display: flex; justify-content: center; padding-top: 2px; max-width: 500px; margin: 0 auto; }
.tabs a {
  flex: 0 1 76px; display: flex; flex-direction: column; align-items: center;
  color: var(--muted); text-decoration: none; padding: 8px 0 6px; cursor: pointer;
}
.tabs svg { width: 29px; height: 29px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs a.on { color: var(--today); }
.tabs a.on svg { stroke-width: 2.2; }
.tabs a::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 3px; margin: 4px auto 0; }
.tabs a.on::after { background: var(--today); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600;
  padding: 10px 16px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ---- More menu (bottom sheet) ---- */
#moreBg { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .22s; }
#moreBg.show { opacity: 1; pointer-events: auto; }
#more {
  position: fixed; left: 50%; bottom: 0; z-index: 31; width: 100%; max-width: 500px;
  max-height: calc(100% - 40px - env(safe-area-inset-top, 0px)); overflow-y: auto; overscroll-behavior: contain;
  transform: translate(-50%, 105%); visibility: hidden;
  background: var(--sheet); color: var(--ink); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.18);
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom, 0px));
  transition: transform .3s cubic-bezier(.32,.72,0,1), visibility 0s linear .3s, background-color .35s;
}
#more.show { transform: translate(-50%, 0); visibility: visible; transition: transform .3s cubic-bezier(.32,.72,0,1), visibility 0s, background-color .35s; }
#more .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--hair); margin: 0 auto 10px; }
#more .sh-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
#more .sh-head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
#more .linkbtn { appearance: none; border: 0; background: none; color: var(--ben); font: inherit; font-size: 16px; font-weight: 700; padding: 6px 2px; cursor: pointer; }
#more h3 { margin: 18px 4px 6px; font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
#more h3 small { text-transform: none; letter-spacing: 0; font-weight: 600; margin-left: 4px; }
#more .group { background: var(--bg); border-radius: 14px; overflow: hidden; transition: background-color .35s; }
#more .pg-row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 6px 12px;
  appearance: none; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer;
}
#more .pg-row + .pg-row { border-top: 0.5px solid var(--hair); }
#more .pg-row .ico { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); flex: none; }
#more .pg-row .ico svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#more .pg-row .nm { flex: 1; font-size: 17px; font-weight: 600; }
#more .pg-row.here .ico, #more .pg-row.here .nm { color: var(--today); }
#more .pg-row .tag { font-size: 12px; font-weight: 700; color: var(--muted); }
#more .pg-row .ctl { display: flex; gap: 4px; }
#more .pg-row .ctl button {
  width: 34px; height: 34px; border-radius: 17px; border: 0; background: var(--chip); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; padding: 0;
}
#more .pg-row .ctl button:disabled { opacity: .3; cursor: default; }
#more .pg-row .ctl button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
#more .pg-row .ctl .rm { color: var(--ash); }
#more .pg-row .ctl .add { color: var(--both); }
#more .pg-empty { padding: 14px 12px; color: var(--muted); font-size: 14px; font-weight: 600; }

#more .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--chip); border-radius: 12px; }
#more .seg button { border: 0; border-radius: 9px; background: none; color: var(--muted); font: inherit; font-size: 15px; font-weight: 700; padding: 9px 0; cursor: pointer; }
#more .seg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

#more .skins { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
#more .skin {
  appearance: none; border: 2px solid transparent; border-radius: 14px; padding: 10px 4px 8px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 7px; font: inherit;
}
#more .skin.on { border-color: var(--ink); }
#more .skin .dots { display: flex; gap: 3px; }
#more .skin .dots i { width: 13px; height: 13px; border-radius: 7px; display: block; }
#more .skin b { font-size: 12px; font-weight: 800; }

#more .acct { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; }
#more .acct span { color: var(--muted); font-size: 14px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#more .acct button { flex: none; border: 0; border-radius: 10px; background: var(--chip); color: var(--ash); font: inherit; font-size: 15px; font-weight: 700; padding: 8px 14px; cursor: pointer; }

/* undo bar */
.undo {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 25;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); border-radius: 22px; padding: 10px 10px 10px 16px;
  font-size: 14px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.2);
}
.undo.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.undo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.undo button { border: 0; border-radius: 14px; background: var(--ben); color: #fff; font: inherit; font-size: 14px; font-weight: 800; padding: 6px 14px; cursor: pointer; flex: none; }

/* ---- Recipes, House and Notes pages (shared look) ---- */
.doc-page .title h1 { white-space: nowrap; }
.doc-page .count { color: var(--muted); font-size: 14px; font-weight: 600; margin-left: 8px; letter-spacing: 0; }
.doc-page header { align-items: center; }
.doc-page .nav svg { width: 18px; height: 18px; }
.doc-page .addBtn { background: var(--ben) !important; color: #fff !important; }
body.viewonly .doc-page .addBtn { display: none; }

.doc-page .dseg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-top: 8px; background: var(--chip); border-radius: 12px; }
.doc-page .dseg button { border: 0; border-radius: 9px; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 700; padding: 7px 0; cursor: pointer; }
.doc-page .dseg button.on { background: var(--bg); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.doc-page .dseg b { font-weight: 800; color: var(--ash); margin-left: 3px; }

.doc-page .dsearch { position: relative; margin-top: 8px; }
.doc-page .dsearch svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2.2; stroke-linecap: round; }
.doc-page .dsearch input {
  width: 100%; border: 0; border-radius: 10px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 16px; padding: 8px 12px 8px 34px; -webkit-appearance: none; appearance: none;
}
.doc-page .dsearch input:focus { outline: 2px solid var(--ben); }
.doc-page .dsearch input::placeholder { color: var(--muted); }
.doc-page .dtags { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; border-bottom: 0.5px solid var(--hair); }
.doc-page .dtags::-webkit-scrollbar { display: none; }
.doc-page .dtags:empty { padding: 4px 0 0; }
.doc-page .dtag, .doc-sheet .dtag {
  flex: none; appearance: none; border: 0; cursor: pointer; font-family: inherit; white-space: nowrap;
  font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 14px; background: var(--chip); color: var(--muted);
}
.doc-page .dtag.on { background: var(--ink); color: var(--bg); }

.doc-page .dgroup { margin: 18px 0 0; padding-bottom: 4px; font-size: 12px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); border-bottom: 0.5px solid var(--hair); }
.doc-page .dlist > .dgroup:first-child { margin-top: 10px; }
.doc-page .item {
  display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 7px 0; border-bottom: 0.5px solid var(--hair);
}
.doc-page .item .main { flex: 1; min-width: 0; appearance: none; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 2px 0; cursor: pointer; }
.doc-page .item .name { font-size: 17px; font-weight: 650; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-page .item .name .pinmark { width: 13px; height: 13px; stroke: var(--today); fill: var(--today); stroke-width: 1.6; vertical-align: -1px; margin-right: 5px; }
.doc-page .item .prev { font-size: 14px; color: var(--muted); line-height: 1.3; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-page .item .meta { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 9px; border-radius: 12px; background: var(--chip); white-space: nowrap; }
.doc-page .item .meta.plain { background: none; padding: 0; }
.doc-page .item .meta.due { background: var(--ash); color: #fff; }
.doc-page .item .meta.soon { background: var(--s3); color: #fff; }
.doc-page .check {
  flex: none; width: 30px; height: 30px; border-radius: 15px; border: 2px solid var(--muted);
  background: none; cursor: pointer; display: grid; place-items: center; padding: 0; transition: background-color .15s, border-color .15s, transform .12s;
}
.doc-page .check:active { transform: scale(.9); }
.doc-page .check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.doc-page .check.did { background: var(--both); border-color: var(--both); }
.doc-page .check.did svg { opacity: 1; }
body.viewonly .doc-page .check { pointer-events: none; }
.doc-page .empty { color: var(--muted); text-align: center; padding: 34px 12px; font-size: 15px; line-height: 1.5; }
.doc-page .empty b { color: var(--ink); }

.doc-page .item.flash { animation: docflash 1.4s ease-out; }
@keyframes docflash { 0%, 30% { background: color-mix(in srgb, var(--ben) 16%, var(--bg)); } 100% { background: var(--bg); } }
/* swipe left to delete */
.doc-page .swipe { position: relative; overflow: hidden; }
.doc-page .swipe .item { position: relative; background: var(--bg); transition: transform .2s ease; touch-action: pan-y; }
.doc-page .swipe.dragging .item { transition: none; }
.doc-page .swipe .delbg { position: absolute; top: 0; right: 0; bottom: 0; width: 88px; border: 0; cursor: pointer; background: var(--ash); color: #fff; font: inherit; font-size: 15px; font-weight: 700; visibility: hidden; }
.doc-page .swipe.dragging .delbg, .doc-page .swipe.open .delbg { visibility: visible; }
body.viewonly .doc-page .swipe .delbg { display: none; }

/* ---- full-screen reader / editor ---- */
.doc-sheet {
  position: fixed; inset: 0; z-index: 12; background: var(--bg); color: var(--ink);
  transform: translateY(104%); visibility: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  transition: transform .3s cubic-bezier(.32,.72,0,1), visibility 0s linear .3s, background-color .35s;
}
.doc-sheet.show { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.32,.72,0,1), visibility 0s, background-color .35s; }
.doc-sheet .dbar {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
  max-width: 500px; margin: 0 auto; background: var(--bg);
  padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
}
@media (display-mode: standalone) { .doc-sheet .dbar { padding-top: calc(20px + env(safe-area-inset-top, 0px)); } }
.doc-sheet .dbar .sp { flex: 1; }
.doc-sheet .dbar button {
  height: 36px; min-width: 36px; border-radius: 18px; border: 0; background: var(--chip); color: var(--ink);
  display: grid; place-items: center; cursor: pointer; font: inherit; font-size: 15px; font-weight: 700; padding: 0 14px;
}
.doc-sheet .dbar button.icon { padding: 0; width: 36px; }
.doc-sheet .dbar svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.doc-sheet .dbar .dpin.on { color: var(--today); }
.doc-sheet .dbar .dpin.on svg { fill: currentColor; }
.doc-sheet .dbar .dedit.save { background: var(--ben); color: #fff; }
body.viewonly .doc-sheet .dpin, body.viewonly .doc-sheet .dedit { display: none; }
.doc-sheet .dbody { max-width: 500px; margin: 0 auto; padding: 4px 18px calc(40px + env(safe-area-inset-bottom, 0px)); }

/* reading */
.doc-sheet h2 { margin: 6px 0 8px; font-size: 27px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; }
.doc-sheet .dmeta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.doc-sheet .dtag { cursor: default; }
.doc-sheet h4 { margin: 22px 0 8px; font-size: 13px; font-weight: 800; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
.doc-sheet .rich { font-size: 18px; line-height: 1.5; }
.doc-sheet .rich p { margin: 0 0 8px; white-space: pre-wrap; word-wrap: break-word; }
.doc-sheet .rich h3 { margin: 18px 0 6px; font-size: 20px; font-weight: 800; letter-spacing: -0.2px; }

      var areaIn = body.querySelector(".farea"), abox = body.querySelector(".asugg");
      if (areaIn) {
        var paintArea = function () { abox.innerHTML = allTags().map(function (t) { return '<button type="button" class="dtag' + (t === areaIn.value.trim() ? " on" : "") + '">' + desc(t) + '</button>'; }).join(""); };
        paintArea(); areaIn.addEventListener("input", paintArea);
        abox.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; areaIn.value = b.textContent; paintArea(); });
        var rep = !!r.repeat_days;
        var paintRep = function () {
          body.querySelector(".rno").classList.toggle("on", !rep); body.querySelector(".ryes").classList.toggle("on", rep);
          body.querySelector(".frep").style.display = rep ? "" : "none"; body.querySelector(".rep span").style.display = rep ? "" : "none";
          body.querySelector(".lastwrap").style.display = rep ? "" : "none";
        };
        body.querySelector(".rno").addEventListener("click", function () { rep = false; paintRep(); });
        body.querySelector(".ryes").addEventListener("click", function () { rep = true; paintRep(); });
        body.repOn = function () { return rep; };
        paintRep();
      }
      var del = body.querySelector(".ddel");
      if (del) del.addEventListener("click", function () {
        var r0 = openRow;
        editingDoc = false; openRow = null; sheet.classList.remove("show"); document.documentElement.style.overflow = "";
        rows = rows.filter(function (x) { return x !== r0; }); render();
        HB.deleteWithUndo(r0.id, r0.name,
          function () { db.from(T).delete().eq("id", r0.id).then(oops); },
          function () { rows.push(r0); render(); });
      });
    }
    // returns false if the sheet should stay open
    function saveEditor() {
      var r = openRow; if (!r) return true;
      var v = function (s) { var el = body.querySelector(s); return el ? el.value : null; };
      var ch = { name: (v(".ftitle") || "").trim() };
      if (kind === "recipe") { ch.ingredients = v(".fing").replace(/\s+$/, ""); ch.steps = v(".fsteps").replace(/\s+$/, ""); ch.note = v(".fnote").replace(/\s+$/, ""); }
      else ch.body = v(".fbody").replace(/\s+$/, "");
      if (kind === "house") {
        ch.area = v(".farea").trim();
        var on = body.repOn && body.repOn(), days = parseInt(v(".frep"), 10);
        ch.repeat_days = on && days > 0 ? days : null;
        ch.last_done = on ? (v(".flast") || null) : null;
      } else ch.tags = splitTags(v(".ftags"));
      var empty = !ch.name && !(ch.body || ch.ingredients || ch.steps || ch.note);
      if (isNew) {
        if (empty) { openRow = null; editingDoc = false; closeSheetOnly(); return true; }
        if (!ch.name) ch.name = (firstLine(ch.body || ch.ingredients || ch.note) || "Untitled").slice(0, 60);
        ch.pinned = !!r.pinned;
        var temp = Object.assign({ id: "tmp" + Date.now(), created_at: new Date().toISOString(), updated_at: new Date().toISOString() }, ch);
        rows.push(temp); isNew = false; openRow = temp;
        if (kind === "house") view = temp.repeat_days ? "check" : "facts";
        db.from(T).insert(ch).select().single().then(function (res) {
          if (oops(res)) return;
          var i = rows.indexOf(temp);
          if (rows.some(function (x) { return x.id === res.data.id; })) { if (i >= 0) rows.splice(i, 1); }
          else if (i >= 0) rows[i] = res.data; else rows.push(res.data);
          if (openRow === temp) { openRow = res.data; if (!editingDoc) showDoc(); }
          render(); if (!openRow) HB.reveal(root, res.data.id);
          lastNew = res.data.id;
        });
        lastNew = temp.id;
        return true;
      }
      if (!ch.name) ch.name = r.name;
      var norm = function (k, x) { return x != null ? x : k === "tags" ? [] : k === "repeat_days" || k === "last_done" ? null : ""; };
      var changed = Object.keys(ch).some(function (k) { return JSON.stringify(norm(k, ch[k])) !== JSON.stringify(norm(k, r[k])); });
      if (changed) {
        Object.assign(r, ch, { updated_at: new Date().toISOString() });
        if (kind === "house") view = r.repeat_days ? "check" : "facts";
        db.from(T).update(ch).eq("id", r.id).then(oops);
      }
      return true;
    }
    function closeSheetOnly() { sheet.classList.remove("show"); document.documentElement.style.overflow = ""; if (document.activeElement) document.activeElement.blur(); render(); }
    var lastNew = null;
    // after the sheet closes on a brand-new item, show where it landed
    sheet.addEventListener("transitionend", function (e) {
      if (e.target === sheet && !sheet.classList.contains("show") && lastNew) { var id = lastNew; lastNew = null; if (byId(id)) HB.reveal(root, id); }
    });
    $q(".addBtn").addEventListener("click", newDoc);

    // ---------- load + live sync ----------
    function loadAll() {
      return db.from(T).select("*").then(function (res) {
        if (res.error) { toast("Couldn't load " + cfg.title + "."); return; }
        var temps = rows.filter(function (r) { return String(r.id).indexOf("tmp") === 0; });
        rows = res.data.concat(temps);
        if (openRow && openRow.id) { var fresh = byId(openRow.id); if (fresh && !editingDoc) { openRow = fresh; showDoc(); } else if (fresh) openRow = fresh; }
        if (!editingDoc) render();
      });
    }
    var reloadT;
    function soon() { clearTimeout(reloadT); reloadT = setTimeout(loadAll, 250); }
    db.channel(pageId + "-live").on("postgres_changes", { event: "*", schema: "public", table: T }, soon).subscribe();
    started = true;
    render(); loadAll();
    // house due dates move with the calendar: redraw once a minute
    if (kind === "house") setInterval(function () { if (!editingDoc) render(); }, 60000);

    mod.refresh = function () { if (started) loadAll(); };
    mod.shown = function () { render(); };
  }

  // Short pages shouldn't scroll: when the keyboard closes, iOS can leave the page nudged up.
  function snapBack() {
    setTimeout(function () {
      if (document.documentElement.scrollHeight <= window.innerHeight + 2 && window.scrollY !== 0) window.scrollTo(0, 0);
    }, 150);
  }
  document.addEventListener("focusout", snapBack);
  window.addEventListener("resize", snapBack);
  if (window.visualViewport) visualViewport.addEventListener("resize", snapBack);

  // ================= light / dark and colour theme =================
  var SKINS = [
    { k: "",          name: "Classic",   light: ["#e4e5e8", "#d45b6c", "#4f7bd4", "#6f8a5c"], dark: ["#1d1e22", "#cf6475", "#5f86d6", "#7d9a68"] },
    { k: "barbie",    name: "Barbie",    light: ["#f8e7ef", "#d9467f", "#5b7fd6", "#e0218a"], dark: ["#2a1624", "#ee5b98", "#7394e0", "#ff4fa3"] },
    { k: "espresso",  name: "Espresso",  light: ["#efe5d8", "#c55f5b", "#5a739c", "#6f4a2f"], dark: ["#211813", "#cf7068", "#7390c2", "#d4a373"] },
    { k: "halloween", name: "Halloween", light: ["#f3e9dc", "#d2574d", "#6b64c9", "#e8772e"], dark: ["#17151b", "#e0645a", "#8a78e6", "#ff7a1a"] }
  ];
  var sysDark = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;
  function mode() { var m = read("homeboard-theme"); return m === "light" || m === "dark" ? m : "auto"; }
  function paintLook() {
    var m = mode(), t = m === "auto" ? (sysDark && sysDark.matches ? "dark" : "light") : m;
    var k = read("homeboard-skin") || "";
    document.documentElement.setAttribute("data-theme", t);
    if (k) document.documentElement.setAttribute("data-skin", k); else document.documentElement.removeAttribute("data-skin");
    // iOS: the top bar colour must match the page exactly, or iOS 26 blurs it
    document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());
    document.querySelectorAll("#modeSeg button").forEach(function (b) { b.classList.toggle("on", b.dataset.m === m); });
    var list = document.getElementById("skinList");
    list.innerHTML = SKINS.map(function (s) {
      var c = s[t];
      return '<button class="skin' + (s.k === k ? " on" : "") + '" data-k="' + s.k + '" style="background:' + c[0] + ';color:' + (t === "dark" ? "#eee" : "#2b2e33") + '">' +
        '<span class="dots"><i style="background:' + c[1] + '"></i><i style="background:' + c[2] + '"></i><i style="background:' + c[3] + '"></i></span><b>' + s.name + '</b></button>';
    }).join("");
  }
  document.getElementById("modeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    store("homeboard-theme", b.dataset.m === "auto" ? null : b.dataset.m); paintLook();
  });
  document.getElementById("skinList").addEventListener("click", function (e) {
    var b = e.target.closest(".skin"); if (!b) return;
    store("homeboard-skin", b.dataset.k); paintLook();
  });
  if (sysDark && sysDark.addEventListener) sysDark.addEventListener("change", function () { if (mode() === "auto") paintLook(); });
  window.addEventListener("storage", function (e) { if (e.key === "homeboard-theme" || e.key === "homeboard-skin") paintLook(); });
  paintLook();

  // ================= tab bar (saved per phone) =================
  function pins() {
    var p = null;
    try { p = JSON.parse(read("homeboard-tabs")); } catch (e) {}
    if (Array.isArray(p)) { p = p.filter(function (id, i) { return page(id) && p.indexOf(id) === i; }).slice(0, MAX_PINS); if (p.length) return p; }
    return PAGES.slice(0, MAX_PINS).map(function (x) { return x.id; });
  }
  function setPins(p) { store("homeboard-tabs", JSON.stringify(p)); paintTabs(); renderList(); }

  var current = null;
  function paintTabs() {
    var p = pins(), onMore = current && p.indexOf(current) < 0;
    document.getElementById("tabs").innerHTML = p.map(function (id) {
      var x = page(id);
      return '<a data-id="' + id + '" href="' + (x.src ? "#" + id : x.href) + '" class="' + (id === current ? "on" : "") + '" aria-label="' + x.name + '" title="' + x.name + '">' + svg(id) + '</a>';
    }).join("") +
      '<a data-id="more" href="#" class="' + (onMore ? "on" : "") + '" aria-label="More" title="More">' + svg("more") + '</a>';
  }
  document.getElementById("tabs").addEventListener("click", function (e) {
    var a = e.target.closest("a"); if (!a) return;
    var id = a.dataset.id;
    if (id === "more") { e.preventDefault(); openMore(); return; }
    if (!page(id).src) return;                    // older stand-alone page: let the link load it
    e.preventDefault();
    if (id === current) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    go(id);
  });

  // ================= More menu =================
  var editingTabs = false;
  var UP = '<svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>',
      DOWN = '<svg viewBox="0 0 24 24"><path d="M6 10l6 6 6-6"/></svg>',
      MINUS = '<svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>',
      PLUS = '<svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>';
  function row(id, ctl) {
    var x = page(id);
    return '<div class="pg-row' + (id === current && !ctl ? " here" : "") + '" data-id="' + id + '" role="button" tabindex="0">' +
      '<span class="ico">' + svg(id) + '</span><span class="nm">' + x.name + '</span>' + (ctl || "") + '</div>';
  }
  function renderList() {
    var p = pins(), rest = PAGES.map(function (x) { return x.id; }).filter(function (id) { return p.indexOf(id) < 0; });
    var el = document.getElementById("pageList"), html;
    if (!editingTabs) {
      html = '<div class="group">' + p.concat(rest).map(function (id) { return row(id); }).join("") + '</div>';
    } else {
      html = '<h3>On the tab bar <small>' + p.length + ' of ' + MAX_PINS + '</small></h3><div class="group">' +
        p.map(function (id, i) {
          return row(id, '<span class="ctl">' +
            '<button data-act="up" aria-label="Move up"' + (i === 0 ? " disabled" : "") + '>' + UP + '</button>' +
            '<button data-act="down" aria-label="Move down"' + (i === p.length - 1 ? " disabled" : "") + '>' + DOWN + '</button>' +
            '<button data-act="rm" class="rm" aria-label="Take off the tab bar"' + (p.length === 1 ? " disabled" : "") + '>' + MINUS + '</button></span>');
        }).join("") + '</div>' +
        '<h3>In More only</h3><div class="group">' +
        (rest.length ? rest.map(function (id) {
          return row(id, '<span class="ctl"><button data-act="add" class="add" aria-label="Add to the tab bar"' + (p.length >= MAX_PINS ? " disabled" : "") + '>' + PLUS + '</button></span>');
        }).join("") : '<div class="pg-empty">Every page is on the tab bar.</div>') + '</div>';
    }
    el.innerHTML = html;
    document.getElementById("editTabs").textContent = editingTabs ? "Done" : "Edit tab bar";
    document.getElementById("moreTitle").textContent = editingTabs ? "Tab bar" : "More";
    document.getElementById("settings").classList.toggle("hidden", editingTabs);
  }
  document.getElementById("pageList").addEventListener("click", function (e) {
    var r = e.target.closest(".pg-row"); if (!r) return;
    var id = r.dataset.id, b = e.target.closest("button[data-act]");
    if (b) {
      if (b.disabled) return;
      var p = pins(), i = p.indexOf(id), act = b.dataset.act;
      if (act === "up" && i > 0) { p.splice(i, 1); p.splice(i - 1, 0, id); }
      else if (act === "down" && i < p.length - 1) { p.splice(i, 1); p.splice(i + 1, 0, id); }
      else if (act === "rm" && p.length > 1) p.splice(i, 1);
      else if (act === "add" && p.length < MAX_PINS) p.push(id);
      setPins(p);
      return;
    }
    if (editingTabs) return;
    closeMore();
    var x = page(id);
    if (x.src) { if (id !== current) go(id); } else location.href = x.href;
  });
  document.getElementById("editTabs").addEventListener("click", function () { editingTabs = !editingTabs; renderList(); });
  function openMore() {
    editingTabs = false; renderList(); paintLook();
    document.getElementById("more").scrollTop = 0;
    document.getElementById("moreBg").classList.add("show");
    document.getElementById("more").classList.add("show");
  }
  function closeMore() {
    document.getElementById("moreBg").classList.remove("show");
    document.getElementById("more").classList.remove("show");
  }
  document.getElementById("moreBg").addEventListener("click", closeMore);
  // drag the sheet down to close it
  (function () {
    var sh = document.getElementById("more"), y0 = null, dy = 0;
    sh.addEventListener("touchstart", function (e) { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
    sh.addEventListener("touchmove", function (e) {
      if (y0 === null) return;
      dy = e.touches[0].clientY - y0;
      if (dy > 0) { sh.style.transition = "none"; sh.style.transform = "translate(-50%," + dy + "px)"; }
    }, { passive: true });
    sh.addEventListener("touchend", function () {
      if (y0 === null) return;
      sh.style.transition = ""; sh.style.transform = "";
      if (dy > 90) closeMore();
      y0 = null;
    });
  })();
  document.getElementById("signOut").addEventListener("click", function () {
    if (!confirm("Sign out of Home Board on this phone?")) return;
    closeMore(); db.auth.signOut();
  });

  // ================= showing pages =================
  var boxes = {}, scrolls = {};
  function load(p) {
    return new Promise(function (resolve, reject) {
      if (mods[p.id]) return resolve(mods[p.id]);
      waiting[p.id] = resolve;
      var s = document.createElement("script");
      s.src = p.src + "?v=" + VERSION;
      s.onerror = function () { s.remove(); reject(); };
      document.head.appendChild(s);
    });
  }
  function mount(p, box) {
    box.innerHTML = "";
    load(p).then(function (mod) {
      mod.mount(box);
      if (current === p.id && mod.shown) mod.shown();
    }, function () {
      box.innerHTML = '<div class="page-msg">Couldn’t load ' + p.name + '.<br><button>Try again</button></div>';
      box.querySelector("button").onclick = function () { mount(p, box); };
    });
  }
  function show(id) {
    var p = page(id);
    if (!p || !p.src) p = page("week");
    if (current === p.id) return;
    if (current && boxes[current]) {
      flushDelete();
      var old = mods[current]; if (old && old.hidden) old.hidden();
      scrolls[current] = window.scrollY; boxes[current].hidden = true;
    }
    current = p.id; paintTabs();
    document.title = p.name;
    var box = boxes[p.id];
    if (!box) {
      box = boxes[p.id] = document.createElement("div");
      box.className = "page"; box.id = "pg-" + p.id;
      document.getElementById("pages").appendChild(box);
      mount(p, box);
    } else {
      box.hidden = false;
      var m = mods[p.id]; if (m) { if (m.shown) m.shown(); if (m.refresh) m.refresh(); }
    }
    window.scrollTo(0, scrolls[p.id] || 0);
  }
  function go(id) { history.replaceState(null, "", "#" + id); show(id); }
  window.addEventListener("hashchange", function () { if (started) show(location.hash.slice(1)); });

  // phone waking up or reopening the app: the page on screen catches up
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    paintLook();
    var m = current && mods[current]; if (m && m.refresh) m.refresh();
  });
  window.addEventListener("pageshow", function (e) { if (e.persisted) { paintLook(); paintTabs(); } });

  // View-only accounts: the database already refuses their changes; this hides editing controls.
  function checkRole() {
    db.rpc("is_editor").then(function (r) {
      var viewer = !r.error && r.data === false;
      HB.viewer = viewer;
      document.body.classList.toggle("viewonly", viewer);
      if (viewer) document.querySelectorAll("#pages textarea, #pages input").forEach(function (t) { t.readOnly = true; });
    }, function () {});
  }

  // ================= sign-in: the whole app needs the household login; each phone stays signed in =================
  var started = false;
  function start(session) {
    document.body.classList.remove("checking", "locked");
    var who = session && session.user && session.user.email;
    document.getElementById("whoami").textContent = who ? "Signed in as " + who : "Signed in";
    checkRole();
    if (!started) { started = true; paintTabs(); show(location.hash.slice(1)); }
  }
  function lock() { document.body.classList.remove("checking"); document.body.classList.add("locked"); }
  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
    btn.disabled = true; err.textContent = "";
    db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    }).then(function (res) {
      btn.disabled = false;
      if (res.error) { err.textContent = "That email or password didn't match."; return; }
      document.getElementById("password").value = "";
      start(res.data && res.data.session);
    });
  });
  db.auth.onAuthStateChange(function (event) { if (event === "SIGNED_OUT") lock(); });
  db.auth.getSession().then(function (res) {
    if (res.data && res.data.session) start(res.data.session); else lock();
  });
})();
</script>
<script>
// stop pinch-zoom and double-tap-zoom in iOS Safari
document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
</script>
