<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<title>Home Board</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #e4e5e8;
  --ink: #2b2e33;
  --muted: #7a7f88;
  --hair: #d0d2d6;
  --ash: #d45b6c;
  --ben: #4f7bd4;
  --both: #6f8a5c;
  --chip: #d5d7db;
  --today: #2b2e33;
  --field: #d9dbdf;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
    --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
    --chip: #2a2b30; --today: #e4e4e2; --field: #26272c;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
  --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
  --chip: #2a2b30; --today: #e4e4e2; --field: #26272c;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body {
  margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 500px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) calc(120px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 0; }
.title h1 { margin: 0; font-size: 24px; white-space: nowrap; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
.title p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
.nav { display: flex; gap: 8px; }
.nav button {
  width: 36px; height: 36px; border-radius: 50%; border: 0;
  background: var(--chip); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.nav .theme svg { width: 18px; height: 18px; }
.nav svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.cols {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  display: grid; grid-template-columns: 56px repeat(3, 1fr);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  padding: 8px 0 6px; border-bottom: 0.5px solid var(--hair);
  font-size: 13px; font-weight: 700; color: var(--muted); text-align: center;
}

#days { flex: 1; display: flex; flex-direction: column; }
.day {
  flex: 0 0 auto; min-height: 64px; padding: 8px 0; border-bottom: 0.5px solid var(--hair);
  display: flex; flex-direction: column; justify-content: center;
}
.row { display: grid; grid-template-columns: 56px repeat(3, 1fr); align-items: center; }
.dname {
  display: flex; flex-direction: column; align-items: flex-start; position: relative;
  appearance: none; border: 0; background: none; color: inherit; font: inherit; cursor: pointer;
  padding: 4px 0; text-align: left;
}
.dname .dow { font-size: 13px; font-weight: 700; color: var(--muted); }
.dname:focus-visible { outline: 2px solid var(--ben); outline-offset: 2px; border-radius: 8px; }
.dname .num {
  font-size: 19px; font-weight: 800; line-height: 1; margin-top: 2px;
  min-width: 30px; height: 30px; display: grid; place-items: center; border-radius: 15px; margin-left: -5px; padding: 0 4px;
}
.day.today .dname .dow { color: var(--ink); }
.day.today .dname .num { background: var(--today); color: var(--bg); }

.cell {
  justify-self: center; appearance: none; border: 0; cursor: pointer;
  width: 46px; height: 46px; border-radius: 23px;
  font-family: inherit; font-size: 19px; font-weight: 800; line-height: 1;
  color: var(--muted); background: var(--chip);
  transition: transform .12s ease, background-color .15s ease;
}
.cell:active { transform: scale(.92); }
.cell[data-v="A"] { background: var(--ash); color: #fff; }
.cell[data-v="B"] { background: var(--ben); color: #fff; }
.cell[data-v="Both"] { background: var(--both); color: #fff; font-size: 12px; letter-spacing: -0.2px; }
.cell:focus-visible, textarea:focus-visible, .nav button:focus-visible { outline: 2px solid var(--ben); outline-offset: 2px; }

.notes-panel { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease; }
.notes-panel > div { overflow: hidden; }
.day.open .notes-panel, .day.has-note .notes-panel { grid-template-rows: 1fr; }
.day.has-note { flex: 0 0 auto; }
textarea {
  display: block; width: 100%; margin: 4px 0 2px; resize: none; overflow: hidden;
  border: 0; border-radius: 10px; background: var(--field); color: var(--ink);
  font-size: 16px; line-height: 1.4; font-weight: 500; font-family: inherit; /* 16px stops iOS zoom on focus */
  padding: 7px 12px; min-height: 36px;
}
textarea:focus { outline: none; }
textarea::placeholder { color: var(--muted); opacity: .7; }

/* bottom bar: small Edit pill above the page tabs (same as Groceries) */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 0.5px solid var(--hair);
  padding: 8px 0 calc(4px + env(safe-area-inset-bottom, 0px));
}
.editrow { display: flex; justify-content: center; }
#authBtn {
  appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 700; padding: 5px 16px; border-radius: 14px;
  background: var(--chip); color: var(--ink); min-width: 70px;
}
body.editing #authBtn { background: var(--ben); color: #fff; }
#authBtn:active { transform: scale(.96); }
.tabs { display: flex; justify-content: center; padding-top: 4px; }
.tabs a {
  flex: 0 1 150px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; padding: 4px 0;
}
.tabs a.on { color: var(--ink); }
.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

@media (prefers-reduced-motion: reduce) { .notes-panel { transition: none; } .cell { transition: none; } .cell:active { transform: none; } }

/* read-only + sign-in sheet */
body.readonly .cell, body.readonly .dname, body.readonly textarea { pointer-events: none; cursor: default; }
.sheet-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none;
  transition: opacity .2s; z-index: 9;
}
.sheet-bg.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; transform: translate(-50%, 120%);
  bottom: 0; width: 100%; max-width: 440px; z-index: 10;
  background: var(--bg); border-radius: 20px 20px 0 0;
  padding: 22px max(18px, env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom, 0px));
  transition: transform .25s cubic-bezier(.32,.72,0,1);
  box-shadow: 0 -8px 40px rgba(0,0,0,.18);
}
.sheet.show { transform: translate(-50%, 0); }
.sheet h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.sheet .sub { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
.sheet input {
  width: 100%; border: 0; border-radius: 12px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 17px; padding: 14px; margin-bottom: 10px;
}
.sheet input:focus { outline: 2px solid var(--ben); outline-offset: 0; }
.sheet .go {
  width: 100%; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg);
  font: inherit; font-size: 17px; font-weight: 700; padding: 14px; cursor: pointer;
}
.sheet .go:disabled { opacity: .5; }
.sheet .cancel { display: block; width: 100%; margin-top: 10px; background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; }
.sheet .err { color: var(--ash); font-size: 15px; min-height: 1.4em; margin: 0 0 6px; }
.hidden { display: none !important; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600;
  padding: 10px 16px; border-radius: 20px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="wrap" id="boardView">
  <header>
    <div class="title"><h1 id="title"></h1></div>
    <div class="nav">
      <button id="theme" class="theme" aria-label="Switch theme"></button>
      <!-- Week arrows: turned off for now. To bring back, uncomment these two buttons AND the two "prev"/"next" listener lines in the script.
      <button id="prev" aria-label="Previous week"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="next" aria-label="Next week"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      -->
    </div>
  </header>
  <div class="cols"><span></span><span>Drop off</span><span>Pick up</span><span>Dinner</span></div>
  <div id="days"></div>
</div>

<div class="bottom">
  <div class="editrow"><button id="authBtn"></button></div>
  <nav class="tabs">
    <a href="./" class="on">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week
    </a>
    <a href="groceries/">
      <svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6l2-8H6.6"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>Groceries
    </a>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<form class="sheet" id="sheet" autocomplete="on">
  <h2>Sign in to edit</h2>
  <p class="sub">Anyone can view the board. Editing needs the household login.</p>
  <input id="email" type="email" placeholder="Email" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <p class="err" id="loginErr"></p>
  <button type="submit" class="go" id="loginBtn">Sign in</button>
  <button type="button" class="cancel" id="sheetCancel">Not now</button>
</form>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  // ---- Supabase connection (the anon key is meant to be public; the table is protected by login) ----
  var SUPABASE_URL = "https://rkvfdveuqueavjsredtm.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdmZkdmV1cXVlYXZqc3JlZHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTY2OTcsImV4cCI6MjEwNTc3MjY5N30.yDt5ivDzLFoBRvrzzuSmT4EEMnIcsjx3XWkvQ6iTfeU";
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var CYCLE = ["", "A", "B", "Both"];
  var NAMES = { "": "nobody yet", A: "Ash", B: "Ben", Both: "both of us" };
  var SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FIELDS = [["drop_off","Drop off"],["pick_up","Pick up"],["dinner","Dinner"]];

  var data = {};     // date -> row
  var refs = {};     // date -> { paint: {field: fn}, t: textarea, day: el }
  var today = new Date();
  var thisWeek, weekStart, channel = null;

  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
  function autosize(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  function blank() { return { drop_off: "", pick_up: "", dinner: "", notes: "" }; }
  thisWeek = weekStart = mondayOf(today);

  var toastEl = document.getElementById("toast"), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  // ---- theme ----
  var MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var themeBtn = document.getElementById("theme");
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.innerHTML = t === "dark" ? SUN : MOON;
    themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("homeboard-theme"); } catch (e) {}
  applyTheme(savedTheme || currentTheme());
  themeBtn.addEventListener("click", function () {
    var t = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(t);
    try { localStorage.setItem("homeboard-theme", t); } catch (e) {}
  });

  // ---- saving ----
  function saveField(key, field, value) {
    data[key] = data[key] || blank();
    data[key][field] = value;
    var row = { date: key, updated_at: new Date().toISOString() };
    row[field] = value;
    return db.from("days").upsert(row, { onConflict: "date" }).then(function (res) {
      if (res.error) toast("Couldn't save. Check your connection.");
    });
  }
  var noteTimers = {};
  function saveNoteSoon(key, value) {
    data[key] = data[key] || blank();
    data[key].notes = value;
    clearTimeout(noteTimers[key]);
    noteTimers[key] = setTimeout(function () { saveField(key, "notes", value); }, 600);
  }

  // ---- drawing ----
  function applyRow(key) {
    var r = refs[key]; if (!r) return;
    var row = data[key] || blank();
    FIELDS.forEach(function (f) { r.paint[f[0]](CYCLE.indexOf(row[f[0]] || "") > 0 ? row[f[0]] : ""); });
    if (document.activeElement !== r.t) { r.t.value = row.notes || ""; autosize(r.t); }
    r.day.classList.toggle("has-note", !!(row.notes || "").trim());
    if ((row.notes || "").trim()) autosize(r.t);
  }

  function render() {
    var wrap = document.getElementById("days");
    wrap.innerHTML = ""; refs = {};
    var fri = addDays(weekStart, 4);
    document.getElementById("title").textContent = SHORT[weekStart.getMonth()] + " " + weekStart.getDate() + " – " +
      (fri.getMonth() !== weekStart.getMonth() ? SHORT[fri.getMonth()] + " " : "") + fri.getDate();

    ["Mon","Tue","Wed","Thu","Fri"].forEach(function (label, i) {
      var date = addDays(weekStart, i);
      var key = iso(date);
      var day = document.createElement("section");
      day.className = "day" + (key === iso(today) ? " today" : "");
      var r = document.createElement("div");
      r.className = "row";

      var dn = document.createElement("button");
      dn.className = "dname";
      dn.setAttribute("aria-expanded", "false");
      dn.setAttribute("aria-label", label + " " + date.getDate() + ", show notes");
      dn.innerHTML = '<span class="dow">' + label + '</span><span class="num">' + date.getDate() + '</span><span class="dot"></span>';
      r.appendChild(dn);

      var paint = {};
      FIELDS.forEach(function (f) {
        var b = document.createElement("button");
        b.className = "cell";
        paint[f[0]] = function (v) {
          b.dataset.v = v; b.textContent = v;
          b.setAttribute("aria-label", label + " " + f[1] + ": " + NAMES[v]);
        };
        paint[f[0]]("");
        b.addEventListener("click", function () {
          if (!editing) return;
          var v = CYCLE[(CYCLE.indexOf(b.dataset.v) + 1) % CYCLE.length];
          paint[f[0]](v);
          saveField(key, f[0], v);
        });
        r.appendChild(b);
      });
      day.appendChild(r);

      var t = document.createElement("textarea");
      t.rows = 1; t.placeholder = "Notes";
      t.setAttribute("aria-label", label + " notes");
      t.readOnly = true;
      t.addEventListener("input", function () {
        autosize(t);
        day.classList.toggle("has-note", !!t.value.trim());
        saveNoteSoon(key, t.value);
      });
      var panel = document.createElement("div"); panel.className = "notes-panel";
      var inner = document.createElement("div"); inner.appendChild(t); panel.appendChild(inner);
      day.appendChild(panel);
      dn.addEventListener("click", function () {
        if (!editing) return;
        var open = day.classList.toggle("open");
        dn.setAttribute("aria-expanded", String(open));
        if (open) { autosize(t); if (!t.value) t.focus({ preventScroll: true }); } else t.blur();
      });

      wrap.appendChild(day);
      refs[key] = { paint: paint, t: t, day: day };
      applyRow(key);
      t.readOnly = !editing;
    });
  }

  function loadWeek() {
    var from = iso(weekStart), to = iso(addDays(weekStart, 4));
    return db.from("days").select("*").gte("date", from).lte("date", to).then(function (res) {
      if (res.error) { toast("Couldn't load the week."); return; }
      res.data.forEach(function (row) { data[row.date] = row; applyRow(row.date); });
    });
  }

  function listen() {
    if (channel) return;
    channel = db.channel("days-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "days" }, function (payload) {
        var row = payload.new;
        if (!row || !row.date) return;
        data[row.date] = row;
        applyRow(row.date);
      })
      .subscribe();
  }

  function go(n) { weekStart = addDays(weekStart, 7 * n); render(); loadWeek(); }
  // Week arrows turned off for now (see the commented-out buttons in the header):
  // document.getElementById("prev").addEventListener("click", function () { go(-1); });
  // document.getElementById("next").addEventListener("click", function () { go(1); });
  window.addEventListener("resize", function () { Object.keys(refs).forEach(function (k) { autosize(refs[k].t); }); });
  // phone waking up or reopening the app: catch up on anything missed
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && refs && Object.keys(refs).length) {
      var now = new Date();
      if (iso(now) !== iso(today)) { today = now; thisWeek = weekStart = mondayOf(today); render(); }
      loadWeek();
    }
  });

  // ---- view mode / edit mode ----
  var editing = false;
  var sheet = document.getElementById("sheet"), sheetBg = document.getElementById("sheetBg");
  var authBtn = document.getElementById("authBtn");

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle("editing", on);
    document.body.classList.toggle("readonly", !on);
    authBtn.textContent = on ? "Done" : "Edit";
    Object.keys(refs).forEach(function (k) {
      refs[k].t.readOnly = !on;
      if (!on) {
        refs[k].day.classList.remove("open");
        refs[k].t.blur();
      }
    });
  }

  function openSheet() {
    sheet.classList.add("show"); sheetBg.classList.add("show");
    setTimeout(function () { document.getElementById("email").focus({ preventScroll: true }); }, 250);
  }
  function closeSheet() {
    sheet.classList.remove("show"); sheetBg.classList.remove("show");
    document.getElementById("loginErr").textContent = "";
  }
  function requestEdit() {
    db.auth.getSession().then(function (res) {
      if (res.data && res.data.session) setEditing(true); else openSheet();
    });
  }

  authBtn.addEventListener("click", function () {
    if (editing) setEditing(false); else requestEdit();
  });
  sheetBg.addEventListener("click", closeSheet);
  document.getElementById("sheetCancel").addEventListener("click", closeSheet);

  sheet.addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
    btn.disabled = true; err.textContent = "";
    db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    }).then(function (res) {
      btn.disabled = false;
      if (res.error) { err.textContent = "That email or password didn't match."; return; }
      document.getElementById("password").value = "";
      closeSheet(); setEditing(true);
    });
  });

  // ---- start: board is public, so just show it ----
  setEditing(false);
  render(); loadWeek(); listen();
})();
</script>
<script>
// stop pinch-zoom and double-tap-zoom in iOS Safari
document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
