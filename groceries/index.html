<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- keep "default": "black-translucent" makes iOS 26 blur the top of the home-screen app -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../apple-touch-icon.png">
<meta name="theme-color" content="#e4e5e8">
<script>
  // Set light/dark before anything draws, and tell iOS the exact top colour.
  // A mismatch here is what makes iOS 26 blur the top of a home-screen web app.
  (function () {
    var t = null;
    try { t = localStorage.getItem("homeboard-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#1d1e22" : "#e4e5e8");
  })();
</script>
<title>Groceries</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  --bg: #e4e5e8; --ink: #2b2e33; --muted: #7a7f88; --hair: #d0d2d6;
  --ash: #d45b6c; --ben: #4f7bd4; --both: #6f8a5c;
  --chip: #d5d7db; --field: #d9dbdf; --sheet: #eeeff1;
  --s0: #d45b6c; --s1: #4f7bd4; --s2: #6f8a5c; --s3: #c98a3e; --s4: #8a6bb8; --s5: #3f9a93;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
    --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
    --chip: #2a2b30; --field: #26272c; --sheet: #25262b;
    --s0: #cf6475; --s1: #5f86d6; --s2: #7d9a68; --s3: #cf9550; --s4: #9679c2; --s5: #4fa69f;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
  --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
  --chip: #2a2b30; --field: #26272c; --sheet: #25262b;
  --s0: #cf6475; --s1: #5f86d6; --s2: #7d9a68; --s3: #cf9550; --s4: #9679c2; --s5: #4fa69f;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
html { height: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 500px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 0; }
h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
.count { color: var(--muted); font-size: 14px; font-weight: 600; margin-left: 8px; }
.nav button {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--chip); color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
}
.nav svg { width: 18px; height: 18px; }

.top {
  position: sticky; top: 0; z-index: 4;
  margin: 0 -16px; padding: calc(4px + env(safe-area-inset-top, 0px)) 16px 0;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  background: var(--bg);
}
.cols {
  display: grid; grid-template-columns: 1fr 120px 46px;
  padding: 8px 0 6px; border-bottom: 0.5px solid var(--hair);
  font-size: 13px; font-weight: 700; color: var(--muted);
}
.cols span:nth-child(2) { text-align: center; }
.cols span:nth-child(3) { text-align: center; }

.add { display: none; gap: 8px; padding: 10px 0; border-bottom: 0.5px solid var(--hair); }
body.editing .add { display: flex; }
.add input {
  flex: 1; border: 0; border-radius: 10px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 16px; padding: 9px 12px; min-width: 0;
}
.add input:focus { outline: 2px solid var(--ben); }
.add button[type="submit"] {
  border: 0; border-radius: 10px; background: var(--ben); color: #fff;
  font: inherit; font-weight: 700; font-size: 15px; padding: 0 16px; cursor: pointer;
}

.item {
  display: grid; grid-template-columns: 1fr 120px 46px; align-items: center;
  min-height: 52px; padding: 6px 0; border-bottom: 0.5px solid var(--hair);
}
.item .main { appearance: none; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 4px 8px 4px 0; cursor: pointer; }
.item .name { font-size: 17px; font-weight: 650; line-height: 1.25; }
.item .note { font-size: 14px; color: var(--muted); line-height: 1.3; margin-top: 2px; white-space: pre-wrap; }
.check {
  justify-self: center; width: 30px; height: 30px; border-radius: 15px; border: 2px solid var(--muted);
  background: none; cursor: pointer; display: grid; place-items: center; padding: 0;
  transition: background-color .15s, border-color .15s, transform .12s;
}
.check:active { transform: scale(.9); }
.check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.item.done .check { background: var(--both); border-color: var(--both); }
.item.done .check svg { opacity: 1; }
.item.done .name { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.item.done .store, .item.done .note { opacity: .6; }

.got { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding-bottom: 4px; border-bottom: 0.5px solid var(--hair); }
.got h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.got button { border: 0; background: none; color: var(--ash); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 6px 0; display: none; }
body.editing .got button { display: block; }
.empty { color: var(--muted); text-align: center; padding: 28px 0; font-size: 15px; }

body.readonly .main, body.readonly .check { pointer-events: none; }

/* store bubble (tap to cycle) */
.item .store {
  justify-self: center; appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 700; color: var(--muted); background: var(--chip);
  border-radius: 14px; padding: 6px 10px; max-width: 118px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: transform .12s, background-color .15s;
}
.item .store:active { transform: scale(.94); }
.item .store.set { background: var(--ink); color: var(--bg); }
.item .store:not(.set) { width: 46px; height: 28px; padding: 0; }
body.readonly .store { pointer-events: none; }

.shop { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto; }
.item .store:not(.set) { color: var(--muted); }
/* one store filter pill */
.filterbar { display: flex; padding: 8px 0 2px; }
.fpill {
  appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 700; padding: 6px 13px; border-radius: 15px;
  background: var(--chip); color: var(--muted);
  transition: background-color .15s, transform .12s;
}
.fpill:active { transform: scale(.95); }
.fpill.on { background: var(--ink); color: var(--bg); }
.fnone { display: inline-flex; align-items: center; gap: 6px; }
.fnone .shop { margin: 0; width: 15px; height: 15px; }
#hideBtn.on { background: var(--ink); color: var(--bg); }

.nav { display: flex; gap: 8px; }
#gear { display: none; }
body.editing #gear { display: grid; }

/* store settings list */
.slist { display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto; }
.srow { display: flex; gap: 8px; align-items: center; }
.srow input { flex: 1; }
.sdot { flex: 0 0 14px; height: 14px; border-radius: 7px; }
.srow .mv, .srow .x {
  flex: 0 0 38px; height: 38px; border: 0; border-radius: 10px; background: var(--chip);
  color: var(--ink); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; display: grid; place-items: center;
}
.srow .x { color: var(--ash); }
.srow .mv:disabled { opacity: .3; }
.sheet h3 { margin: 0 0 12px; font-size: 20px; font-weight: 700; }
.sheet .addstore { display: flex; gap: 8px; margin-top: 12px; }
.sheet .addstore input { flex: 1; }
.sheet .addstore button { border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 700; padding: 0 16px; cursor: pointer; }

/* bottom bar: small Edit pill above the page tabs, one shared background */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 0.5px solid var(--hair);
  padding: 8px 0 calc(4px + env(safe-area-inset-bottom, 0px));
}
.tabs { display: flex; justify-content: center; padding-top: 4px; }
.tabs a {
  flex: 0 1 150px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; padding: 4px 0;
}
.tabs a.on { color: var(--ink); }
.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* item sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
.sheet-bg.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 120%); z-index: 10;
  width: 100%; max-width: 500px; background: var(--sheet); border-radius: 20px 20px 0 0;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  transition: transform .25s cubic-bezier(.32,.72,0,1); box-shadow: 0 -8px 40px rgba(0,0,0,.18);
}
.sheet.show { transform: translate(-50%, 0); }
.sheet label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
.sheet label:first-child { margin-top: 0; }
.sheet input, .sheet textarea {
  width: 100%; border: 0; border-radius: 10px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 16px; padding: 10px 12px; resize: none;
}
.sheet input:focus, .sheet textarea:focus { outline: 2px solid var(--ben); }
.sheet textarea { min-height: 76px; }
.spick {
  appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 700; border-radius: 16px; padding: 8px 16px;
  min-width: 64px; min-height: 36px; background: var(--chip); color: var(--ink);
  transition: transform .12s, background-color .15s;
}
.spick:active { transform: scale(.95); }
.addpick { min-width: 54px; min-height: 0; font-size: 13px; padding: 0 12px; border-radius: 10px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spick.set { background: var(--ink); color: var(--bg); }
.stores { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.stores button {
  border: 0; border-radius: 14px; background: var(--chip); color: var(--ink);
  font: inherit; font-size: 14px; font-weight: 600; padding: 5px 12px; cursor: pointer;
}
.stores button.on { background: var(--ink); color: var(--bg); }
.sheet .row { display: flex; gap: 10px; margin-top: 18px; }
.sheet .row button { flex: 1; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 700; padding: 12px; cursor: pointer; }
.sheet .del { background: var(--chip); color: var(--ash); }
.sheet .done { background: var(--ink); color: var(--bg); }

.toast {
  position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 16px;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; white-space: nowrap;
}
.toast.show { opacity: 1; }


/* full-page sign-in gate */
body.checking .wrap, body.checking .bottom, body.checking .gate { visibility: hidden; }
body.locked .wrap, body.locked .bottom { display: none; }
.gate {
  display: none; position: fixed; inset: 0; z-index: 20; overflow: hidden;
  align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg);
}

.gate form {
  position: relative; z-index: 1;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border-radius: 24px; padding: 30px 22px 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,.10);
}
body.locked .gate { display: flex; }
.gate form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.gate img { width: 76px; height: 76px; border-radius: 18px; margin: 0 auto 4px; }
.gate h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
.gate .hello { margin: 0 0 6px; color: var(--ink); font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.gate input {
  width: 100%; border: 0; border-radius: 12px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 17px; padding: 14px; text-align: left;
}
.gate input:focus { outline: 2px solid var(--ben); outline-offset: 0; }
.gate button {
  border: 0; border-radius: 12px; background: var(--ink); color: var(--bg);
  font: inherit; font-size: 17px; font-weight: 700; padding: 14px; cursor: pointer;
}
.gate button:disabled { opacity: .5; }
.gate .err { color: var(--ash); font-size: 15px; min-height: 1.4em; margin: 0; }

/* (old sign-in sheet styles unused) */
.sheet h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.sheet .sub { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
.sheet input {
  width: 100%; border: 0; border-radius: 12px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 17px; padding: 14px; margin-bottom: 10px;
}
.sheet input:focus { outline: 2px solid var(--ben); outline-offset: 0; }
.sheet .go {
  width: 100%; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg);
  font: inherit; font-size: 17px; font-weight: 700; padding: 14px; cursor: pointer;
}
.sheet .go:disabled { opacity: .5; }
.sheet .cancel { display: block; width: 100%; margin-top: 10px; background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; }
.sheet .err { color: var(--ash); font-size: 15px; min-height: 1.4em; margin: 0 0 6px; }
.sheet form, form.sheet { margin: 0; }
.sheet input[type=email], .sheet input[type=password] { margin-bottom: 10px; }

/* solid strip behind the status bar / Dynamic Island so nothing scrolls under it (any iPhone) */
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: env(safe-area-inset-top, 0px); background: var(--bg); pointer-events: none;
}

/* home-screen app only: nudge content down, clear of the iOS status-bar blur */
@media (display-mode: standalone) {
  .top { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
}
</style>
</head>
<body class="checking editing">

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="on">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <p class="err" id="loginErr"></p>
    <button type="submit" id="loginBtn">Sign in</button>
  </form>
</div>


<div class="wrap">
  <div class="top">
  <header>
    <div><h1>Groceries<span class="count" id="count"></span></h1></div>
    <div class="nav">
      <button id="gear" aria-label="Stores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button id="hideBtn" aria-label="Hide items you've got"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button id="theme" aria-label="Switch theme"></button>
    </div>
  </header>
  <div class="filterbar"><button class="fpill" id="storeFilter">All stores</button></div>
  <div class="cols"><span>Item</span><span>Store</span><span>Got</span></div>
  </div>
  <form class="add" id="addForm">
    <input id="addInput" placeholder="Add an item" autocomplete="off" enterkeyhint="done">
    <button type="button" class="spick addpick" id="addPick"></button>
    <button type="submit">Add</button>
  </form>
  <div id="list"></div>
  <div class="got" id="gotHead"><h2>Got it</h2><button id="clearBtn">Clear</button></div>
  <div id="gotList"></div>
</div>

<div class="bottom">
  <nav class="tabs">
    <a href="../">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Week
    </a>
    <a href="./" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6l2-8H6.6"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>Groceries
    </a>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <label for="fName">Item</label>
  <input id="fName" autocomplete="off">
  <label>Store</label>
  <button type="button" class="spick" id="storePick"></button>
  <label for="fNote">Note</label>
  <textarea id="fNote" placeholder="Brand, size, which kind…"></textarea>
  <div class="row"><button class="del" id="delBtn">Delete</button><button class="done" id="doneBtn">Done</button></div>
</div>

<div class="sheet" id="storeSheet">
  <h3>Stores</h3>
  <div class="slist" id="slist"></div>
  <form class="addstore" id="addStoreForm"><input id="addStore" placeholder="Add a store" autocomplete="off"><button type="submit">Add</button></form>
  <div class="row"><button class="done" id="storeDone">Done</button></div>
</div>


<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  var SUPABASE_URL = "https://rkvfdveuqueavjsredtm.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrdmZkdmV1cXVlYXZqc3JlZHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTY2OTcsImV4cCI6MjEwNTc3MjY5N30.yDt5ivDzLFoBRvrzzuSmT4EEMnIcsjx3XWkvQ6iTfeU";
  var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var $ = function (id) { return document.getElementById(id); };

  var stores = [];   // [{id, name, position}]
  var items = [];    // [{id, name, store_id, note, done, created_at}]
  var editing = true, openId = null;   // always editable once signed in
  var NONE = "__none";
  var filterStore = "", hideGot = false;
  try { hideGot = localStorage.getItem("g-hide") === "1"; filterStore = localStorage.getItem("g-store") || ""; } catch (e) {}
  function saveFilters() { try { localStorage.setItem("g-hide", hideGot ? "1" : "0"); localStorage.setItem("g-store", filterStore); } catch (e) {} }

  var SHOP = '<svg class="shop" viewBox="0 0 24 24"><path d="M4 9.5L5.5 4h13L20 9.5"/><path d="M4 9.5a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0 2.7 2.7 0 0 0 5.3 0"/><path d="M5.5 11.5V20h13v-8.5M10 20v-5h4v5"/></svg>';
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 2000); }
  function oops(res) { if (res && res.error) { toast("Couldn't save. Check your connection."); loadAll(); return true; } return false; }

  function storeById(id) { for (var i = 0; i < stores.length; i++) if (stores[i].id === id) return stores[i]; return null; }
  function storeIndex(id) { for (var i = 0; i < stores.length; i++) if (stores[i].id === id) return i; return -1; }
  function tint(el, id) {
    var i = id ? storeIndex(id) : -1;
    el.style.background = i < 0 ? "" : "var(--s" + (i % 6) + ")";
    el.style.color = i < 0 ? "" : "#fff";
  }
  function paintPill(el, id) {
    var s = id ? storeById(id) : null;
    if (s) el.textContent = s.name; else el.innerHTML = SHOP;
    el.classList.toggle("set", !!s); tint(el, s ? id : "");
  }
  function nextStore(id) {
    var cycle = [""].concat(stores.map(function (s) { return s.id; }));
    return cycle[(cycle.indexOf(id || "") + 1) % cycle.length];
  }

  // ---- filters ----
  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.3 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function renderFilters() {
    var p = $("storeFilter");
    if (filterStore === NONE) { p.innerHTML = '<span class="fnone">' + SHOP + 'No store</span>'; tint(p, ""); }
    else { var s = storeById(filterStore); p.textContent = s ? s.name : "All stores"; tint(p, s ? filterStore : ""); }
    p.classList.toggle("on", !!filterStore);
    $("hideBtn").innerHTML = hideGot ? EYE_OFF : EYE;
    $("hideBtn").classList.toggle("on", hideGot);
  }
  $("storeFilter").addEventListener("click", function () {
    var cycle = [""].concat(stores.map(function (s) { return s.id; }), [NONE]);
    filterStore = cycle[(cycle.indexOf(filterStore) + 1) % cycle.length];
    saveFilters(); render();
  });
  $("hideBtn").addEventListener("click", function () { hideGot = !hideGot; saveFilters(); render(); });

  // ---- list ----
  function row(it) {
    var el = document.createElement("div");
    el.className = "item" + (it.done ? " done" : "");
    el.innerHTML =
      '<button class="main"><div class="name">' + esc(it.name) + '</div>' +
      (it.note ? '<div class="note">' + esc(it.note) + '</div>' : '') + '</button>' +
      '<button class="store"></button>' +
      '<button class="check" aria-label="Got it"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>';
    var st = el.querySelector(".store");
    paintPill(st, it.store_id);
    el.querySelector(".main").addEventListener("click", function () { if (editing) openSheet(it.id); });
    st.addEventListener("click", function () {
      if (!editing) return;
      it.store_id = nextStore(it.store_id) || null; render();
      db.from("grocery_items").update({ store_id: it.store_id }).eq("id", it.id).then(oops);
    });
    el.querySelector(".check").addEventListener("click", function () {
      if (!editing) return;
      it.done = !it.done; render();
      db.from("grocery_items").update({ done: it.done }).eq("id", it.id).then(oops);
    });
    return el;
  }

  function render() {
    if (filterStore && filterStore !== NONE && !storeById(filterStore)) filterStore = "";
    renderFilters();
    var list = $("list"), got = $("gotList");
    list.innerHTML = ""; got.innerHTML = "";
    var shown = items.filter(function (i) {
      if (!filterStore) return true;
      if (filterStore === NONE) return !i.store_id;
      return i.store_id === filterStore;
    });
    var newest = function (a, b) { return a.created_at < b.created_at ? 1 : -1; };
    var todo = shown.filter(function (i) { return !i.done; }).sort(newest);
    var done = shown.filter(function (i) { return i.done; }).sort(newest);
    todo.forEach(function (i) { list.appendChild(row(i)); });
    if (!todo.length) {
      var fs = storeById(filterStore);
      list.innerHTML = '<div class="empty">' + (filterStore === NONE ? "Nothing without a store" : fs ? "Nothing for " + esc(fs.name) : "Nothing on the list") + '</div>';
    }
    if (!hideGot) done.forEach(function (i) { got.appendChild(row(i)); });
    $("gotHead").style.display = (done.length && !hideGot) ? "" : "none";
    var left = items.filter(function (i) { return !i.done; }).length;
    $("count").textContent = left ? left + " to get" : "";
    paintPill($("addPick"), addStore);
  }

  // ---- add item ----
  var addStore = "";
  $("addPick").addEventListener("click", function () {
    addStore = nextStore(addStore); paintPill($("addPick"), addStore);
    $("addInput").focus({ preventScroll: true });
  });
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("addInput").value.trim(); if (!v) return;
    var row = { name: v, store_id: addStore || null };
    $("addInput").value = ""; addStore = "";
    db.from("grocery_items").insert(row).select().single().then(function (res) {
      if (oops(res)) return;
      if (!items.some(function (i) { return i.id === res.data.id; })) items.push(res.data);
      render();
    });
    render();
  });
  $("clearBtn").addEventListener("click", function () {
    items = items.filter(function (i) { return !i.done; }); render();
    db.from("grocery_items").delete().eq("done", true).then(oops);
  });

  // ---- sheets ----
  function showSheet(id) { $(id).classList.add("show"); $("sheetBg").classList.add("show"); }
  function hideSheets() {
    ["sheet", "storeSheet"].forEach(function (id) { $(id).classList.remove("show"); });
    $("sheetBg").classList.remove("show");
    if (document.activeElement) document.activeElement.blur();
  }

  // item sheet
  var sheetStore = "";
  $("storePick").addEventListener("click", function () { sheetStore = nextStore(sheetStore); paintPill($("storePick"), sheetStore); });
  function openSheet(id) {
    var it = items.find(function (i) { return i.id === id; }); if (!it) return;
    openId = id; sheetStore = it.store_id || "";
    $("fName").value = it.name; $("fNote").value = it.note || "";
    paintPill($("storePick"), sheetStore); showSheet("sheet");
  }
  function closeItem(save) {
    var it = items.find(function (i) { return i.id === openId; });
    if (it && save) {
      var ch = { name: $("fName").value.trim() || it.name, store_id: sheetStore || null, note: $("fNote").value.trim() };
      if (ch.name !== it.name || ch.store_id !== (it.store_id || null) || ch.note !== (it.note || "")) {
        Object.assign(it, ch);
        db.from("grocery_items").update(ch).eq("id", it.id).then(oops);
      }
    }
    openId = null; hideSheets(); render();
  }
  $("doneBtn").addEventListener("click", function () { closeItem(true); });
  $("delBtn").addEventListener("click", function () {
    var id = openId;
    items = items.filter(function (i) { return i.id !== id; }); closeItem(false);
    db.from("grocery_items").delete().eq("id", id).then(oops);
  });

  // store settings
  function renderStores() {
    var box = $("slist"); box.innerHTML = "";
    if (!stores.length) box.innerHTML = '<div class="empty" style="padding:12px 0">No stores yet</div>';
    stores.forEach(function (s, i) {
      var r = document.createElement("div"); r.className = "srow";
      r.innerHTML = '<span class="sdot" style="background:var(--s' + (i % 6) + ')"></span><input value="' + esc(s.name) + '" autocomplete="off">' +
        '<button class="mv" type="button" aria-label="Move up"' + (i === 0 ? " disabled" : "") + '>↑</button>' +
        '<button class="x" type="button" aria-label="Remove">×</button>';
      var inp = r.querySelector("input");
      inp.addEventListener("change", function () {
        var v = inp.value.trim();
        if (!v) { inp.value = s.name; return; }
        s.name = v; db.from("grocery_stores").update({ name: v }).eq("id", s.id).then(oops);
      });
      r.querySelector(".mv").addEventListener("click", function () {
        if (i === 0) return;
        var a = stores[i - 1], b = stores[i], pa = a.position, pb = b.position;
        if (pa === pb) pb = pa + 1;
        a.position = pb; b.position = pa;
        stores.sort(function (x, y) { return x.position - y.position; }); renderStores();
        db.from("grocery_stores").upsert([{ id: a.id, name: a.name, position: a.position }, { id: b.id, name: b.name, position: b.position }]).then(oops);
      });
      r.querySelector(".x").addEventListener("click", function () {
        stores.splice(i, 1);
        items.forEach(function (it) { if (it.store_id === s.id) it.store_id = null; });
        renderStores();
        db.from("grocery_stores").delete().eq("id", s.id).then(oops);
      });
      box.appendChild(r);
    });
  }
  $("gear").addEventListener("click", function () { renderStores(); showSheet("storeSheet"); });
  $("addStoreForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("addStore").value.trim(); if (!v) return;
    var pos = stores.length ? stores[stores.length - 1].position + 1 : 0;
    $("addStore").value = "";
    db.from("grocery_stores").insert({ name: v, position: pos }).select().single().then(function (res) {
      if (oops(res)) return;
      if (!storeById(res.data.id)) stores.push(res.data);
      renderStores();
    });
  });
  $("storeDone").addEventListener("click", function () { if (document.activeElement) document.activeElement.blur(); setTimeout(function () { hideSheets(); render(); }, 50); });
  $("sheetBg").addEventListener("click", function () {
    if ($("sheet").classList.contains("show")) closeItem(true); else { hideSheets(); render(); }
  });

  // ---- load + live sync ----
  function loadAll() {
    return Promise.all([
      db.from("grocery_stores").select("*").order("position"),
      db.from("grocery_items").select("*")
    ]).then(function (r) {
      if (r[0].error || r[1].error) { toast("Couldn't load the list."); return; }
      stores = r[0].data; items = r[1].data;
      if (!openId) render();
      if ($("storeSheet").classList.contains("show") && !$("storeSheet").contains(document.activeElement)) renderStores();
    });
  }
  var reloadT;
  function soon() { clearTimeout(reloadT); reloadT = setTimeout(loadAll, 250); }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && started) loadAll(); });

  // ---- theme (shared with the week board) ----
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme(t) { document.documentElement.setAttribute("data-theme", t); document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#1d1e22" : "#e4e5e8"); $("theme").innerHTML = t === "dark" ? SUN : MOON; }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("homeboard-theme"); } catch (e) {}
  applyTheme(savedTheme || currentTheme());
  $("theme").addEventListener("click", function () {
    var t = currentTheme() === "dark" ? "light" : "dark"; applyTheme(t);
    try { localStorage.setItem("homeboard-theme", t); } catch (e) {}
  });

  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
  var started = false;
  function START() {
    if (started) { loadAll(); return; }
    started = true;
    db.channel("groceries-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "grocery_items" }, soon)
      .on("postgres_changes", { event: "*", schema: "public", table: "grocery_stores" }, soon)
      .subscribe();
    render(); loadAll();
  }

  // ---- sign-in gate: the whole app needs the household login; each phone stays signed in ----
  function lock() { document.body.classList.remove("checking"); document.body.classList.add("locked"); }
  function unlock() { document.body.classList.remove("checking", "locked"); }
  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
    btn.disabled = true; err.textContent = "";
    db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    }).then(function (res) {
      btn.disabled = false;
      if (res.error) { err.textContent = "That email or password didn't match."; return; }
      document.getElementById("password").value = "";
      unlock(); START();
    });
  });
  db.auth.onAuthStateChange(function (event) { if (event === "SIGNED_OUT") lock(); });
  db.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { unlock(); START(); } else lock();
  });

})();
</script>
</body>
</html>
