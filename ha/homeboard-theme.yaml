# Home Board look for Home Assistant: the four Home Board colour themes, each with light and dark.
# Pick one in your Home Assistant profile (Theme), or it follows the default set for everyone.
# The Home Board wall card (custom:homeboard-wall) takes its colours from whichever one is on.

Home Board:
  primary-font-family: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif'
  ha-font-family-body: '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif'
  ha-font-weight-medium: "700"
  ha-font-weight-bold: "800"
  ha-card-border-radius: "26px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "none"
  ha-card-features-border-radius: "18px"
  ha-tile-icon-border-radius: "999px"
  ha-dialog-border-radius: "28px"
  ha-border-radius-lg: "22px"
  app-header-border-bottom: "none"
  mush-card-primary-font-weight: "800"
  mush-card-secondary-font-weight: "700"
  mush-icon-border-radius: "999px"
  mush-control-border-radius: "18px"
  mush-chip-border-radius: "999px"
  modes:
    light:
      primary-color: "#4f7bd4"
      accent-color: "#4f7bd4"
      text-primary-color: "#ffffff"
      primary-background-color: "#e4e5e8"
      secondary-background-color: "#d5d7db"
      lovelace-background: "#e4e5e8"
      card-background-color: "#eeeff1"
      ha-card-background: "#eeeff1"
      ha-dialog-surface-background: "#eeeff1"
      mdc-theme-surface: "#eeeff1"
      primary-text-color: "#2b2e33"
      secondary-text-color: "#7a7f88"
      disabled-text-color: "#d0d2d6"
      divider-color: "#d0d2d6"
      input-fill-color: "#d9dbdf"
      app-header-background-color: "#e4e5e8"
      app-header-text-color: "#2b2e33"
      sidebar-background-color: "#eeeff1"
      sidebar-text-color: "#2b2e33"
      sidebar-icon-color: "#7a7f88"
      sidebar-selected-icon-color: "#4f7bd4"
      sidebar-selected-text-color: "#4f7bd4"
      state-icon-color: "#7a7f88"
      state-light-active-color: "#c98a3e"
      state-cover-active-color: "#c98a3e"
      state-climate-heat-color: "#d45b6c"
      state-climate-cool-color: "#4f7bd4"
      switch-checked-color: "#4f7bd4"
      switch-checked-button-color: "#4f7bd4"
    dark:
      primary-color: "#5f86d6"
      accent-color: "#5f86d6"
