      ha-card-background: "#25262b"
      ha-dialog-surface-background: "#25262b"
      mdc-theme-surface: "#25262b"
      primary-text-color: "#e4e4e2"
      secondary-text-color: "#8b9098"
      disabled-text-color: "#2c2d32"
      divider-color: "#2c2d32"
      input-fill-color: "#26272c"
      app-header-background-color: "#1d1e22"
      app-header-text-color: "#e4e4e2"
      sidebar-background-color: "#25262b"
      sidebar-text-color: "#e4e4e2"
      sidebar-icon-color: "#8b9098"
      sidebar-selected-icon-color: "#5f86d6"
      sidebar-selected-text-color: "#5f86d6"
