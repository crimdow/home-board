<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- keep "default": "black-translucent" makes iOS 26 blur the top of the home-screen app -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Board">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="theme-color" content="#e4e5e8">
<script>
  // Set light/dark before anything draws, and tell iOS the exact top colour.
  // A mismatch here is what makes iOS 26 blur the top of a home-screen web app.
  (function () {
    var t = null;
    try { t = localStorage.getItem("homeboard-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    try { var k = localStorage.getItem("homeboard-skin"); if (k) document.documentElement.setAttribute("data-skin", k); } catch (e) {}
    setTimeout(function () { document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()); }, 0);
  })();
</script>
<title>Meals</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  --bg: #e4e5e8; --ink: #2b2e33; --muted: #7a7f88; --hair: #d0d2d6;
  --ash: #d45b6c; --ben: #4f7bd4; --both: #6f8a5c;
  --chip: #d5d7db; --field: #d9dbdf; --sheet: #eeeff1;
  --s0: #d45b6c; --s1: #4f7bd4; --s2: #6f8a5c; --s3: #c98a3e; --s4: #8a6bb8; --s5: #3f9a93; --s6: #b8735a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
    --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
    --chip: #2a2b30; --field: #26272c; --sheet: #25262b;
    --s0: #cf6475; --s1: #5f86d6; --s2: #7d9a68; --s3: #cf9550; --s4: #9679c2; --s5: #4fa69f; --s6: #c4826a;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1e22; --ink: #e4e4e2; --muted: #8b9098; --hair: #2c2d32;
  --ash: #cf6475; --ben: #5f86d6; --both: #7d9a68;
  --chip: #2a2b30; --field: #26272c; --sheet: #25262b;
  --s0: #cf6475; --s1: #5f86d6; --s2: #7d9a68; --s3: #cf9550; --s4: #9679c2; --s5: #4fa69f; --s6: #c4826a;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { touch-action: manipulation; overscroll-behavior: none; }
html { height: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 500px; margin: 0 auto; display: flex; flex-direction: column;   /* no forced full height: short lists don't scroll */
  padding: 2px max(16px, env(safe-area-inset-right, 0px)) calc(84px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 0; }
h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; }
.count { color: var(--muted); font-size: 14px; font-weight: 600; margin-left: 8px; }
.nav button {
  width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--chip); color: var(--ink);
  display: grid; place-items: center; cursor: pointer;
}
.nav svg { width: 18px; height: 18px; }

.top {
  position: sticky; top: 0; z-index: 4;
  margin: 0 -16px; padding: calc(4px + env(safe-area-inset-top, 0px)) 16px 0;
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  background: var(--bg);
}
.cols {
  display: grid; grid-template-columns: 1fr 120px 46px;
  padding: 8px 0 6px; border-bottom: 0.5px solid var(--hair);
  font-size: 13px; font-weight: 700; color: var(--muted);
}
.cols span:nth-child(2) { text-align: center; }
.cols span:nth-child(3) { text-align: center; }

.add { display: none; gap: 8px; padding: 10px 0; border-bottom: 0.5px solid var(--hair); }
body.editing .add { display: flex; }
.add input {
  flex: 1; border: 0; border-radius: 10px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 16px; padding: 9px 12px; min-width: 0;
}
.add input:focus { outline: 2px solid var(--ben); }
.add button[type="submit"] {
  border: 0; border-radius: 10px; background: var(--ben); color: #fff;
  font: inherit; font-weight: 700; font-size: 15px; padding: 0 16px; cursor: pointer;
}

.item {
  display: grid; grid-template-columns: 1fr 120px 46px; align-items: center;
  min-height: 52px; padding: 6px 0; border-bottom: 0.5px solid var(--hair);
}
.item .main { appearance: none; border: 0; background: none; color: inherit; font: inherit; text-align: left; padding: 4px 8px 4px 0; cursor: pointer; }
.item .name { font-size: 17px; font-weight: 650; line-height: 1.25; }
.item .note { font-size: 14px; color: var(--muted); line-height: 1.3; margin-top: 2px; white-space: pre-wrap; }
.check {
  justify-self: center; width: 30px; height: 30px; border-radius: 15px; border: 2px solid var(--muted);
  background: none; cursor: pointer; display: grid; place-items: center; padding: 0;
  transition: background-color .15s, border-color .15s, transform .12s;
}
.check:active { transform: scale(.9); }
.check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.item.done .check { background: var(--both); border-color: var(--both); }
.item.done .check svg { opacity: 1; }
.item.done .name { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.item.done .store, .item.done .note { opacity: .6; }

.got { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding-bottom: 4px; border-bottom: 0.5px solid var(--hair); }
.got h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.got button { border: 0; background: none; color: var(--ash); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; padding: 6px 0; display: none; }
body.editing .got button { display: block; }
.empty { color: var(--muted); text-align: center; padding: 28px 0; font-size: 15px; }

body.readonly .main, body.readonly .check { pointer-events: none; }

/* store bubble (tap to cycle) */
.item .store {
  justify-self: center; appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 13px; font-weight: 700; color: var(--muted); background: var(--chip);
  border-radius: 14px; padding: 6px 10px; max-width: 118px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: transform .12s, background-color .15s;
}
.item .store:active { transform: scale(.94); }
.item .store.set { background: var(--ink); color: var(--bg); }
.item .store:not(.set) { width: 46px; height: 28px; padding: 0; }
body.readonly .store { pointer-events: none; }

.shop { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; display: block; margin: 0 auto; }
.item .store:not(.set) { color: var(--muted); }
/* one store filter pill */
.filterbar { display: flex; padding: 8px 0 2px; }
.fpill {
  appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 14px; font-weight: 700; padding: 6px 13px; border-radius: 15px;
  background: var(--chip); color: var(--muted);
  transition: background-color .15s, transform .12s;
}
.fpill:active { transform: scale(.95); }
.fpill.on { background: var(--ink); color: var(--bg); }
.fnone { display: inline-flex; align-items: center; gap: 6px; }
.fnone .shop { margin: 0; width: 15px; height: 15px; }
#hideBtn.on { background: var(--ink); color: var(--bg); }

.nav { display: flex; gap: 8px; }
#gear { display: none; }
body.editing #gear { display: grid; }

/* store settings list */
.slist { display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto; }
.srow { display: flex; gap: 8px; align-items: center; }
.srow input { flex: 1; }
.sdot { flex: 0 0 14px; height: 14px; border-radius: 7px; }
.srow .mv, .srow .x {
  flex: 0 0 38px; height: 38px; border: 0; border-radius: 10px; background: var(--chip);
  color: var(--ink); font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; display: grid; place-items: center;
}
.srow .x { color: var(--ash); }
.srow .mv:disabled { opacity: .3; }
.sheet h3 { margin: 0 0 12px; font-size: 20px; font-weight: 700; }
.sheet .addstore { display: flex; gap: 8px; margin-top: 12px; }
.sheet .addstore input { flex: 1; }
.sheet .addstore button { border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 700; padding: 0 16px; cursor: pointer; }

/* bottom bar: small Edit pill above the page tabs, one shared background */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border-top: 0.5px solid var(--hair);
  padding: 8px 0 calc(4px + env(safe-area-inset-bottom, 0px));
}
.tabs { display: flex; justify-content: center; padding-top: 4px; }
.tabs a {
  flex: 0 1 150px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); text-decoration: none; font-size: 11px; font-weight: 600; padding: 4px 0;
}
.tabs a.on { color: var(--ink); }
.tabs svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* item sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9; }
.sheet-bg.show { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 120%); z-index: 10;
  width: 100%; max-width: 500px; background: var(--sheet); border-radius: 20px 20px 0 0;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  transition: transform .25s cubic-bezier(.32,.72,0,1); box-shadow: 0 -8px 40px rgba(0,0,0,.18);
}
.sheet.show { transform: translate(-50%, 0); }
.sheet label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
.sheet label:first-child { margin-top: 0; }
.sheet input, .sheet textarea {
  width: 100%; border: 0; border-radius: 10px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 16px; padding: 10px 12px; resize: none;
}
.sheet input:focus, .sheet textarea:focus { outline: 2px solid var(--ben); }
.sheet textarea { min-height: 76px; }
.spick {
  appearance: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 700; border-radius: 16px; padding: 8px 16px;
  min-width: 64px; min-height: 36px; background: var(--chip); color: var(--ink);
  transition: transform .12s, background-color .15s;
}
.spick:active { transform: scale(.95); }
.addpick { min-width: 54px; min-height: 0; font-size: 13px; padding: 0 12px; border-radius: 10px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spick.set { background: var(--ink); color: var(--bg); }
.stores { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.stores button {
  border: 0; border-radius: 14px; background: var(--chip); color: var(--ink);
  font: inherit; font-size: 14px; font-weight: 600; padding: 5px 12px; cursor: pointer;
}
.stores button.on { background: var(--ink); color: var(--bg); }
.sheet .row { display: flex; gap: 10px; margin-top: 18px; }
.sheet .row button { flex: 1; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 700; padding: 12px; cursor: pointer; }
.sheet .del { background: var(--chip); color: var(--ash); }
.sheet .done { background: var(--ink); color: var(--bg); }

.toast {
  position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 16px;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; white-space: nowrap;
}
.toast.show { opacity: 1; }


/* full-page sign-in gate */
body.checking .wrap, body.checking .bottom, body.checking .gate { visibility: hidden; }
body.locked .wrap, body.locked .bottom { display: none; }
.gate {
  display: none; position: fixed; inset: 0; z-index: 20; overflow: hidden;
  align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg);
}

.gate form {
  position: relative; z-index: 1;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border-radius: 24px; padding: 30px 22px 24px;
  box-shadow: 0 12px 40px rgba(0,0,0,.10);
}
body.locked .gate { display: flex; }
.gate form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
.gate img { width: 76px; height: 76px; border-radius: 18px; margin: 0 auto 4px; }
.gate h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
.gate .hello { margin: 0 0 6px; color: var(--ink); font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.gate input {
  width: 100%; border: 0; border-radius: 12px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 17px; padding: 14px; text-align: left;
}
.gate input:focus { outline: 2px solid var(--ben); outline-offset: 0; }
.gate button {
  border: 0; border-radius: 12px; background: var(--ink); color: var(--bg);
  font: inherit; font-size: 17px; font-weight: 700; padding: 14px; cursor: pointer;
}
.gate button:disabled { opacity: .5; }
.gate .err { color: var(--ash); font-size: 15px; min-height: 1.4em; margin: 0; }

/* (old sign-in sheet styles unused) */
.sheet h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.sheet .sub { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
.sheet input {
  width: 100%; border: 0; border-radius: 12px; background: var(--field); color: var(--ink);
  font: inherit; font-size: 17px; padding: 14px; margin-bottom: 10px;
}
.sheet input:focus { outline: 2px solid var(--ben); outline-offset: 0; }
.sheet .go {
  width: 100%; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg);
  font: inherit; font-size: 17px; font-weight: 700; padding: 14px; cursor: pointer;
}
.sheet .go:disabled { opacity: .5; }
.sheet .cancel { display: block; width: 100%; margin-top: 10px; background: none; border: 0; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; }
.sheet .err { color: var(--ash); font-size: 15px; min-height: 1.4em; margin: 0 0 6px; }
.sheet form, form.sheet { margin: 0; }
.sheet input[type=email], .sheet input[type=password] { margin-bottom: 10px; }

/* solid strip behind the status bar / Dynamic Island so nothing scrolls under it (any iPhone) */
body::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: env(safe-area-inset-top, 0px); background: var(--bg); pointer-events: none;
}

/* home-screen app only: nudge content down, clear of the iOS status-bar blur */
@media (display-mode: standalone) {
  .top { padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
}
/* Meals: two columns (meal, made) */
.cols, .item { grid-template-columns: 1fr 64px 46px !important; }
.cols span:nth-child(2), .cols span:nth-child(3) { text-align: center; }
.dpill {
  justify-self: center; appearance: none; border: 0; cursor: pointer; font-family: inherit;
  min-width: 50px; height: 30px; padding: 0 10px; border-radius: 15px;
  font-size: 14px; font-weight: 700; background: var(--chip); color: var(--muted);
  display: grid; place-items: center; transition: transform .12s, background-color .15s;
}
.dpill:active { transform: scale(.94); }
.dpill.set { color: #fff; }
.dpill .shop { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.item.done .dpill { opacity: .6; }
.add .dpill { height: auto; border-radius: 10px; min-width: 54px; }
.sheet .dpill { justify-self: start; height: 36px; border-radius: 18px; min-width: 64px; }
.item { min-height: 56px; }
.tabs a { flex: 0 1 120px; }
#addBtn { background: var(--ben); color: #fff; }
#addBtn svg { width: 18px; height: 18px; }
.sheet.quick { display: flex; gap: 8px; padding-top: 10px; padding-bottom: 10px; border-radius: 16px 16px 0 0; }
.sheet.quick input { flex: 1; min-width: 0; }
.sheet.quick button { min-width: 72px; border: 0; border-radius: 10px; background: var(--ben); color: #fff; font: inherit; font-size: 16px; font-weight: 700; padding: 0 18px; cursor: pointer; }
.sheet.quick button.finish { background: var(--ink); color: var(--bg); }

/* icon-only tab bar (5 pages) */
.tabs { padding-top: 2px; }
.tabs a { flex: 0 1 76px !important; padding: 8px 0 6px !important; }
.tabs svg { width: 29px !important; height: 29px !important; stroke-width: 1.8 !important; }
.tabs a.on svg { stroke-width: 2.2 !important; }
.tabs a.on::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 3px; background: var(--ink); margin: 4px auto 0; }
.tabs a:not(.on)::after { content: ""; display: block; height: 5px; margin-top: 4px; }

/* new-row highlight */
.item.flash { animation: rowflash 1.4s ease-out; }
@keyframes rowflash { 0%, 30% { background: color-mix(in srgb, var(--ben) 16%, var(--bg)); } 100% { background: var(--bg); } }

/* view-only accounts: no editing controls, nothing tappable in the lists */
.vo { display: none; align-items: center; height: 36px; padding: 0 12px; border-radius: 18px; background: var(--chip); color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
body.viewonly .vo { display: inline-flex; }
body.viewonly #addBtn, body.viewonly #gear, body.viewonly #clearBtn { display: none !important; }
body.viewonly #list, body.viewonly #gotList, body.viewonly #days { pointer-events: none; }
body.viewonly .who, body.viewonly .kind, body.viewonly .dpill, body.viewonly .store, body.viewonly .check,
body.viewonly .when, body.viewonly .tile, body.viewonly .cell { cursor: default; }

/* done/made/got check on the left, delete on the right */
.item .check { justify-self: start; }
.item .main { padding-left: 2px; }
.del {
  justify-self: center; appearance: none; border: 0; background: none; cursor: pointer; padding: 0;
  width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; color: var(--muted);
}
.del svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.del:active { background: var(--chip); color: var(--ash); }
body.viewonly .del { visibility: hidden; }
/* undo bar */
.undo {
  position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  display: flex; align-items: center; gap: 14px; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); border-radius: 22px; padding: 10px 10px 10px 16px;
  font-size: 14px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.2);
}
.undo.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.undo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.undo button { border: 0; border-radius: 14px; background: var(--ben); color: #fff; font: inherit; font-size: 14px; font-weight: 800; padding: 6px 14px; cursor: pointer; flex: none; }
.cols, .item { grid-template-columns: 44px 1fr 64px !important; column-gap: 6px; }
.cols span:first-child { text-align: left; }
.cols span:nth-child(2) { text-align: left !important; padding-left: 2px; }

/* swipe left to delete (like Mail) */
.swipe { position: relative; overflow: hidden; }
.swipe .item { position: relative; background: var(--bg); transition: transform .2s ease; touch-action: pan-y; }
.swipe.dragging .item { transition: none; }
.swipe .delbg {
  position: absolute; top: 0; right: 0; bottom: 0; width: 88px; border: 0; cursor: pointer;
  background: var(--ash); color: #fff; font: inherit; font-size: 15px; font-weight: 700;
}
body.viewonly .swipe .delbg { display: none; }
.swipe .delbg { visibility: hidden; }
.swipe.dragging .delbg, .swipe.open .delbg { visibility: visible; }
/* ---- colour themes (picked with the palette button on Weekly Plan) ---- */
:root[data-skin="barbie"][data-theme="light"] { --bg: #f8e7ef; --ink: #3b1f33; --muted: #9b7489; --hair: #ecd0dd; --ash: #d9467f; --ben: #5b7fd6; --both: #6f9a73; --chip: #f0d5e1; --today: #e0218a; --field: #f2dbe6; --sheet: #fdf1f6; }
:root[data-skin="barbie"][data-theme="dark"] { --bg: #2a1624; --ink: #f7dde9; --muted: #b98ba4; --hair: #3e2437; --ash: #ee5b98; --ben: #7394e0; --both: #80ae83; --chip: #3a2134; --today: #ff4fa3; --field: #331c2d; --sheet: #331c2d; }
:root[data-skin="espresso"][data-theme="light"] { --bg: #efe5d8; --ink: #3a2a20; --muted: #8d7866; --hair: #ddcebc; --ash: #c55f5b; --ben: #5a739c; --both: #7b8a58; --chip: #e3d5c3; --today: #6f4a2f; --field: #e8dccc; --sheet: #f6eee4; }
:root[data-skin="espresso"][data-theme="dark"] { --bg: #211813; --ink: #efe2d2; --muted: #a38d79; --hair: #34271f; --ash: #cf7068; --ben: #7390c2; --both: #8f9c69; --chip: #30241c; --today: #d4a373; --field: #2a1f19; --sheet: #2a1f19; }
:root[data-skin="halloween"][data-theme="light"] { --bg: #f3e9dc; --ink: #2b2230; --muted: #8b7e86; --hair: #e2d4c3; --ash: #d2574d; --ben: #6b64c9; --both: #6b9a44; --chip: #e9dac8; --today: #e8772e; --field: #eee0cf; --sheet: #f9f2e9; }
:root[data-skin="halloween"][data-theme="dark"] { --bg: #17151b; --ink: #f1e8dd; --muted: #8f8797; --hair: #2b2731; --ash: #e0645a; --ben: #8a78e6; --both: #80b34c; --chip: #26222c; --today: #ff7a1a; --field: #211e26; --sheet: #211e26; }
body, .top, .bottom { transition: background-color .35s ease, color .35s ease; }
.tabs a.on { color: var(--today) !important; }
.tabs a.on::after { background: var(--today) !important; }
</style>
</head>

      meals = meals.filter(function (x) { return x !== m; }); render();
      deleteWithUndo(m.id, m.name,
        function () { db.from("meals").delete().eq("id", m.id).then(oops); },
        function () { meals.push(m); render(); });
    });
  }
  function render() {
    var list = $("list"), got = $("gotList"); list.innerHTML = ""; got.innerHTML = "";
    var newest = function (a, b) { return a.created_at < b.created_at ? 1 : -1; };
    // planned meals first, in weekday order; then unplanned ideas, newest first
    var todo = meals.filter(function (m) { return !m.done; }).sort(function (a, b) {
      var da = a.day ? DAYS.indexOf(a.day) : 99, db2 = b.day ? DAYS.indexOf(b.day) : 99;
      return da !== db2 ? da - db2 : newest(a, b);
    });
    var done = meals.filter(function (m) { return m.done; }).sort(newest);
    todo.forEach(function (m) { list.appendChild(row(m)); });
    if (!todo.length) list.innerHTML = '<div class="empty">No ideas yet. Tap + to add some.</div>';
    if (!hideMade) done.forEach(function (m) { got.appendChild(row(m)); });
    $("gotHead").style.display = (done.length && !hideMade) ? "" : "none";
    $("hideBtn").innerHTML = hideMade ? EYE_OFF : EYE;
    $("hideBtn").classList.toggle("on", hideMade);
    $("count").textContent = todo.length ? todo.length + (todo.length === 1 ? " idea" : " ideas") : "";
  }
  $("hideBtn").addEventListener("click", function () {
    hideMade = !hideMade; try { localStorage.setItem("m-hide", hideMade ? "1" : "0"); } catch (e) {} render();
  });
  $("clearBtn").addEventListener("click", function () {
    meals = meals.filter(function (m) { return !m.done; }); render();
    db.from("meals").delete().eq("done", true).then(oops);
  });

  // ---- quick add: Enter adds and stays open; empty box -> Done closes ----
  function hugKeyboard() {
    var vv = window.visualViewport, q = $("quickSheet");
    if (!vv || !q.classList.contains("show")) { q.style.bottom = ""; return; }
    q.style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + "px";
  }
  if (window.visualViewport) { visualViewport.addEventListener("resize", hugKeyboard); visualViewport.addEventListener("scroll", hugKeyboard); }
  function paintQuick() {
    var has = !!$("quickName").value.trim();
    $("quickBtn").textContent = has ? "Add" : "Done";
    $("quickBtn").classList.toggle("finish", !has);
  }
  function openQuick() {
    $("quickName").value = ""; paintQuick();
    $("quickSheet").classList.add("show"); $("sheetBg").classList.add("show");
    $("quickName").focus(); hugKeyboard();
  }
  function closeQuick() {
    $("quickSheet").style.bottom = ""; $("quickSheet").classList.remove("show"); $("sheetBg").classList.remove("show");
    if (document.activeElement) document.activeElement.blur();
  }
  $("addBtn").addEventListener("click", openQuick);
  $("quickName").addEventListener("input", paintQuick);
  $("quickSheet").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("quickName").value.trim();
    if (!v) { closeQuick(); if (lastAdded) setTimeout(function () { reveal(lastAdded); }, 350); return; }
    var temp = { id: "tmp" + Date.now() + Math.random(), name: v, note: "", day: "", done: false, created_at: new Date().toISOString() };
    meals.push(temp); render(); lastAdded = temp.id; reveal(temp.id);
    $("quickName").value = ""; paintQuick(); $("quickName").focus();
    db.from("meals").insert({ name: v }).select().single().then(function (res) {
      if (oops(res)) return;
      if (lastAdded === temp.id) lastAdded = res.data.id;
      var i = meals.indexOf(temp);
      if (byId(res.data.id)) { if (i >= 0) meals.splice(i, 1); }
      else if (i >= 0) meals[i] = res.data; else meals.push(res.data);
      render(); if (lastAdded === res.data.id) reveal(res.data.id);
    });
  });

  // ---- edit sheet ----
  var sheetDay = "";
  $("sheetDay").addEventListener("click", function () { sheetDay = nextDay(sheetDay); paintDay($("sheetDay"), sheetDay); });
  function openSheet(id) {
    var m = byId(id); if (!m || String(m.id).indexOf("tmp") === 0) return;
    openId = id; $("fName").value = m.name; $("fNote").value = m.note || "";
    sheetDay = m.day || ""; paintDay($("sheetDay"), sheetDay);
    $("sheet").classList.add("show"); $("sheetBg").classList.add("show");
  }
  function closeSheet(keep) {
    var m = byId(openId);
    if (m && keep) {
      var ch = { name: $("fName").value.trim() || m.name, note: $("fNote").value.trim(), day: sheetDay };
      if (ch.name !== m.name || ch.note !== (m.note || "") || ch.day !== (m.day || "")) { Object.assign(m, ch); save(m, ch); }
    }
    openId = null; if (document.activeElement) document.activeElement.blur();
    $("sheet").classList.remove("show"); $("sheetBg").classList.remove("show"); render();
  }
  $("doneBtn").addEventListener("click", function () { closeSheet(true); });
  $("delBtn").addEventListener("click", function () {
    var id = openId; meals = meals.filter(function (x) { return x.id !== id; }); closeSheet(false);
    db.from("meals").delete().eq("id", id).then(oops);
  });
  $("sheetBg").addEventListener("click", function () {
    if ($("quickSheet").classList.contains("show")) closeQuick(); else closeSheet(true);
  });

  // ---- load + live sync ----
  function loadAll() {
    return db.from("meals").select("*").then(function (r) {
      if (r.error) { toast("Couldn't load meals."); return; }
      meals = (r.data || []).filter(notPending);
      if (!openId && !settleT) render();
    });
  }
  var reloadT;
  function soon() { clearTimeout(reloadT); reloadT = setTimeout(loadAll, 250); }
  var started = false;
  function START() {
    if (started) { loadAll(); return; }
    started = true;
    db.channel("meals-live").on("postgres_changes", { event: "*", schema: "public", table: "meals" }, soon).subscribe();
    render(); loadAll();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden && started) loadAll(); });

  // ---- theme (shared across pages) ----
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function currentTheme() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || (t === "dark" ? "#1d1e22" : "#e4e5e8"));
    $("theme").innerHTML = t === "dark" ? SUN : MOON;
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("homeboard-theme"); } catch (e) {}
  applyTheme(savedTheme || currentTheme());
  $("theme").addEventListener("click", function () {
    var t = currentTheme() === "dark" ? "light" : "dark"; applyTheme(t);
    try { localStorage.setItem("homeboard-theme", t); } catch (e) {}
  });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
  // ---- sign-in gate: the whole app needs the household login; each phone stays signed in ----
  function lock() { document.body.classList.remove("checking"); document.body.classList.add("locked"); }
  function unlock() { document.body.classList.remove("checking", "locked"); }
  document.getElementById("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = document.getElementById("loginBtn"), err = document.getElementById("loginErr");
    btn.disabled = true; err.textContent = "";
    db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    }).then(function (res) {
      btn.disabled = false;
      if (res.error) { err.textContent = "That email or password didn't match."; return; }
      document.getElementById("password").value = "";
      unlock(); START(); checkRole();
    });
  });
  db.auth.onAuthStateChange(function (event) { if (event === "SIGNED_OUT") lock(); });
  db.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { unlock(); START(); checkRole(); } else lock();
  });

})();
</script>
</body>
</html>
